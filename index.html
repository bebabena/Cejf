  --gutter: 16px;

  --f-serif: 'Fraunces', 'Iowan Old Style', 'Georgia', serif;
  --f-voice: 'Fraunces', 'Iowan Old Style', 'Georgia', serif;
  --f-sans: 'Instrument Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-mono: 'DM Mono', 'SFMono-Regular', ui-monospace, 'Menlo', monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A0E08; --surface: #25160E; --surface-2: #2E1D13; --surface-3: #3A271A; --sheet: #21130C;
    --line: rgba(243, 230, 211, .08); --line-2: rgba(243, 230, 211, .15);
    --ink: #F3E6D3; --ink-2: #CFBBA5; --ink-3: #9C8470; --ink-4: #6F5948;
    --accent: #D8743F; --accent-ink: #EC9563; --accent-soft: rgba(216, 116, 63, .16); --accent-glow: rgba(216, 116, 63, .40); --on-accent: #1A0E08;
    --sour: #E2BA52; --bitter: #E0775A; --weak: #93B7CC; --strong: #C99466; --good: #A3C983; --warn: #E7A956;
    --tint-sour: rgba(226, 186, 82, .20); --tint-bitter: rgba(224, 119, 90, .18); --tint-weak: rgba(147, 183, 204, .16); --tint-strong: rgba(10, 4, 2, .45);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35); --shadow-sheet: 0 -16px 50px rgba(0, 0, 0, .55); --scrim: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1A0E08; --surface: #25160E; --surface-2: #2E1D13; --surface-3: #3A271A; --sheet: #21130C;
  --line: rgba(243, 230, 211, .08); --line-2: rgba(243, 230, 211, .15);
  --ink: #F3E6D3; --ink-2: #CFBBA5; --ink-3: #9C8470; --ink-4: #6F5948;
  --accent: #D8743F; --accent-ink: #EC9563; --accent-soft: rgba(216, 116, 63, .16); --accent-glow: rgba(216, 116, 63, .40); --on-accent: #1A0E08;
  --sour: #E2BA52; --bitter: #E0775A; --weak: #93B7CC; --strong: #C99466; --good: #A3C983; --warn: #E7A956;
  --tint-sour: rgba(226, 186, 82, .20); --tint-bitter: rgba(224, 119, 90, .18); --tint-weak: rgba(147, 183, 204, .16); --tint-strong: rgba(10, 4, 2, .45);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35); --shadow-sheet: 0 -16px 50px rgba(0, 0, 0, .55); --scrim: rgba(0, 0, 0, .55);
  color-scheme: dark;
}

/* ── base ─────────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 15px/1.5 var(--f-sans); letter-spacing: .005em;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--accent-ink); }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
::selection { background: var(--accent-soft); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.serif { font-family: var(--f-serif); }
.voice { font-family: var(--f-voice); font-style: italic; }
.eyebrow { font: 600 10.5px/1.2 var(--f-sans); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); }
.muted { color: var(--ink-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* ── shell ────────────────────────────────────────────────────────────────── */
.app { min-height: 100%; display: flex; flex-direction: column; }
.hdr {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) var(--gutter) 10px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
}
.hdr.scrolled { box-shadow: 0 1px 0 var(--line); }
.wordmark { display: block; height: 26px; width: auto; color: var(--ink); }
.wordmark .drop { fill: var(--accent); }
.main { flex: 1; width: 100%; max-width: 560px; margin: 0 auto; padding: 4px var(--gutter) calc(var(--nav-h) + 32px + env(safe-area-inset-bottom, 0px)); }
.view { display: flex; flex-direction: column; gap: 14px; animation: viewIn .28s ease both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.page-title { font: 560 30px/1.1 var(--f-serif); font-variation-settings: 'opsz' 72; letter-spacing: -.01em; margin: 10px 0 2px; text-wrap: balance; }

.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; justify-content: center; gap: 4px;
  padding: 6px 10px calc(6px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: saturate(1.4) blur(16px); -webkit-backdrop-filter: saturate(1.4) blur(16px);
  box-shadow: 0 -1px 0 var(--line);
}
.nav button {
  flex: 1; max-width: 120px; position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 7px 4px 5px; border-radius: 14px; color: var(--ink-3); font: 600 11px/1 var(--f-sans); letter-spacing: .02em;
  transition: color .2s, background .2s;
}
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--ink); }
.nav button[aria-current="page"] .nav-ico { background: var(--accent-soft); color: var(--accent-ink); }
.nav-ico { display: grid; place-items: center; width: 52px; height: 30px; border-radius: 15px; transition: background .2s, color .2s; }
.nav .dot { position: absolute; top: 6px; right: calc(50% - 22px); width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--bg); }

/* ── controls ─────────────────────────────────────────────────────────────── */
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--surface); }
.seg button { padding: 7px 13px; border-radius: 999px; font: 600 12.5px/1 var(--f-sans); color: var(--ink-3); transition: all .18s; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { background: var(--surface-3); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { background: var(--surface-3); } }
.seg.full { display: flex; }
.seg.full button { flex: 1; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 22px;
  border-radius: 999px; background: var(--accent); color: var(--on-accent); font: 650 15px/1 var(--f-sans); letter-spacing: .01em;
  box-shadow: 0 6px 20px var(--accent-glow); transition: transform .12s, box-shadow .2s, opacity .2s;
}
.btn:active { transform: scale(.98); }
.btn.block { display: flex; width: 100%; }
.btn.quiet { background: var(--surface); color: var(--ink); box-shadow: none; }
.btn.ghost { background: transparent; color: var(--ink-2); box-shadow: none; min-height: 44px; padding: 0 12px; }
.btn.sm { min-height: 38px; padding: 0 16px; font-size: 13.5px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.link { color: var(--accent-ink); font-weight: 600; font-size: 13.5px; padding: 6px 0; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 13px; border-radius: 999px; background: var(--surface);
  font: 600 13px/1 var(--f-sans); color: var(--ink-2); transition: all .15s; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gutter)); padding: 0 var(--gutter); }
.chips.scroll::-webkit-scrollbar { display: none; }
.icon-btn { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; color: var(--ink-2); }
.icon-btn:active { background: var(--surface); }
.card { background: var(--surface); border-radius: var(--radius); padding: 18px; }
.divider { height: 1px; background: var(--line); border: 0; margin: 4px 0; }

/* stepper */
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper > button { width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font: 500 20px/1 var(--f-sans); color: var(--ink); }
.stepper > button:active { background: var(--surface-3); }
.stepper .val { min-width: 92px; text-align: center; font: 500 20px/1 var(--f-mono); }
.stepper .val small { font: 600 11px var(--f-sans); color: var(--ink-3); margin-left: 3px; letter-spacing: .04em; }
.field { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.field:first-child { border-top: 0; }
.field-lab { font-weight: 600; font-size: 14.5px; }
.field-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
input[type=text], input[type=date], input[type=number], input[type=email], select, textarea {
  width: 100%; min-height: 46px; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--line-2);
  background: var(--bg); font-size: 15px; outline: none; transition: border-color .15s;
}
textarea { min-height: 90px; resize: vertical; line-height: 1.45; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
select { appearance: none; -webkit-appearance: none; padding-right: 38px;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position: calc(100% - 20px) 50%, calc(100% - 15px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
label.lab { display: block; font: 600 12px/1.2 var(--f-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin: 14px 0 7px; }
.switch { position: relative; width: 48px; height: 28px; border-radius: 14px; background: var(--surface-3); transition: background .2s; flex-shrink: 0; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }

/* ── Brew: coffee row ─────────────────────────────────────────────────────── */
.coffee-row { display: flex; align-items: center; gap: 12px; padding: 8px 2px 4px; text-align: left; width: 100%; }
.coffee-name { font: 560 23px/1.15 var(--f-serif); font-variation-settings: 'opsz' 48; letter-spacing: -.005em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.coffee-name.empty { color: var(--ink-3); font-style: normal; font-weight: 440; }
.coffee-meta { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px 10px; font: 600 10.5px/1.3 var(--f-sans); letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3); }
.coffee-meta .status { color: var(--accent-ink); }
.coffee-meta .status.ok { color: var(--good); }
.chev { color: var(--ink-4); flex-shrink: 0; }

/* ── Brew: recipe card ────────────────────────────────────────────────────── */
.recipe { position: relative; background: var(--surface); border-radius: 24px; padding: 16px 18px 18px; }
.recipe-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.style-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px 7px 13px; border-radius: 999px; background: var(--bg); font: 650 13px/1 var(--f-sans); color: var(--ink); }
.style-btn svg { color: var(--ink-3); }
.readout { display: flex; align-items: flex-end; gap: 12px; padding: 4px 0 2px; width: 100%; text-align: left; }
.readout .num { font: 500 38px/1 var(--f-mono); letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
.readout .num small { font: 600 15px/1 var(--f-sans); letter-spacing: 0; color: var(--ink-3); margin-left: 3px; }
.readout .mid { display: flex; flex-direction: column; align-items: center; gap: 3px; align-self: stretch; justify-content: flex-start; padding-top: 6px; color: var(--ink-4); }
.readout .mid .ratio { font: 500 11px/1 var(--f-mono); color: var(--ink-3); background: var(--bg); padding: 4px 7px; border-radius: 999px; letter-spacing: -.01em; white-space: nowrap; }
.readout .mid svg { width: 18px; height: 18px; }
.readout .cap { display: block; font: 600 10.5px/1 var(--f-sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-top: 7px; }
.specs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.spec { text-align: left; padding: 11px 12px 10px; border-radius: 14px; background: var(--bg); min-width: 0; }
.spec .v { font: 500 17px/1.1 var(--f-mono); letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spec.long .v { font-size: 14px; line-height: 17px; letter-spacing: -.035em; }
.spec .v small { font: 600 11px var(--f-sans); color: var(--ink-3); margin-left: 2px; letter-spacing: 0; }
.spec .k { font: 600 10px/1 var(--f-sans); letter-spacing: .11em; text-transform: uppercase; color: var(--ink-3); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spec.changed .v { color: var(--accent-ink); }
.spec.changed { box-shadow: inset 0 0 0 1.5px var(--accent-soft); animation: pulseIn .9s ease; }
@keyframes pulseIn { 0% { box-shadow: inset 0 0 0 1.5px var(--accent); transform: scale(1.03); } 100% { box-shadow: inset 0 0 0 1.5px var(--accent-soft); transform: none; } }
.was { font: 500 11px var(--f-mono); color: var(--ink-4); text-decoration: line-through; margin-left: 4px; }
.spec .k .was { margin-left: 0; font-size: 11.5px; letter-spacing: 0; text-transform: none; }
.why-line { margin-top: 12px; font-size: 12.5px; color: var(--ink-3); line-height: 1.45; }
.why-line b { color: var(--ink-2); font-weight: 600; }
.drink-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 14px; }
.milk-chip { font: 600 12.5px var(--f-sans); color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; padding: 6px 2px; }
.milk-chip b { color: var(--ink); }

/* ── Brew: timer ──────────────────────────────────────────────────────────── */
.timer { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px 0 4px; }
.dial { position: relative; width: 196px; height: 196px; border-radius: 50%; display: grid; place-items: center; touch-action: manipulation; }
.dial svg.ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.dial .track { stroke: var(--surface-2); }
.dial .win { stroke: color-mix(in srgb, var(--accent) 30%, var(--surface-2)); stroke-linecap: round; }
.dial .prog { stroke: var(--accent); stroke-linecap: round; transition: stroke .3s; }
.dial.in .prog { stroke: var(--good); }
.dial.over .prog { stroke: var(--warn); }
.dial .face { position: relative; width: 150px; height: 150px; border-radius: 50%; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; box-shadow: var(--shadow); transition: transform .15s; }
.dial:active .face { transform: scale(.97); }
.dial .t { font: 500 40px/1 var(--f-mono); letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.dial .t small { font: 600 14px var(--f-sans); color: var(--ink-3); margin-left: 2px; letter-spacing: 0; }
.dial .hint { font: 600 11px/1 var(--f-sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.dial.running .hint { color: var(--accent-ink); }
.t-state { font: 600 13px var(--f-sans); color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; font: 650 11.5px/1.2 var(--f-sans); letter-spacing: .02em; background: var(--surface); color: var(--ink-2); }
.pill.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.pill.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.pill.accent { background: var(--accent-soft); color: var(--accent-ink); }
.timer-actions { display: flex; gap: 10px; width: 100%; }
.timer-actions .btn { flex: 1; }
.step-now { width: 100%; text-align: center; padding: 4px 8px 2px; }
.step-now .to { font: 500 30px/1 var(--f-mono); letter-spacing: -.03em; }
.step-now .txt { font-size: 14.5px; color: var(--ink-2); margin-top: 6px; }
.step-now .nxt { font-size: 12px; color: var(--ink-3); margin-top: 6px; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; width: 100%; }
.steps li { display: flex; gap: 12px; align-items: baseline; padding: 9px 12px; border-radius: 12px; color: var(--ink-3); font-size: 14px; transition: all .2s; }
.steps li .at { font: 500 12.5px var(--f-mono); min-width: 38px; color: var(--ink-4); }
.steps li.now { background: var(--accent-soft); color: var(--ink); }
.steps li.now .at { color: var(--accent-ink); }
.steps li.done { color: var(--ink-4); }
.steps li.check { cursor: pointer; }
.steps li.check .box { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--line-2); flex-shrink: 0; display: grid; place-items: center; transform: translateY(3px); }
.steps li.check.done .box { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* ── last result strip on Brew ────────────────────────────────────────────── */
.last { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 18px; background: var(--surface); width: 100%; text-align: left; }
.last .mini { flex-shrink: 0; }
.last .t1 { font: 600 14px/1.3 var(--f-sans); }
.last .t2 { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 18px; background: var(--accent-soft); }
.notice .t1 { font: 650 14px/1.3 var(--f-sans); }
.notice .t2 { font-size: 13px; color: var(--ink-2); margin-top: 3px; line-height: 1.45; }
.notice .x { margin-left: auto; flex-shrink: 0; }

/* ── Taste compass ────────────────────────────────────────────────────────── */
.compass-wrap { position: relative; width: min(100%, 380px); margin: 2px auto 0; aspect-ratio: 1.14; }
.compass { position: absolute; top: 34px; bottom: 34px; left: 50%; aspect-ratio: 1; transform: translateX(-50%); touch-action: none; border-radius: 50%; outline: none; }
.compass svg { width: 100%; height: 100%; overflow: visible; display: block; }
.compass:focus-visible { box-shadow: 0 0 0 3px var(--accent-soft); }
.c-disc { fill: var(--surface); }
.c-ring { fill: none; stroke: var(--line-2); stroke-width: 1; }
.c-ring.faint { stroke: var(--line); }
.c-axis { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 5; }
.c-sweet { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 3 4; opacity: .9; }
.c-dot { fill: var(--accent); filter: drop-shadow(0 3px 6px rgba(0, 0, 0, .25)); transition: r .15s; }
.c-dot-core { fill: var(--on-accent); opacity: .9; }
.c-ghost { fill: var(--ink-3); opacity: .35; }
.c-trail { fill: none; stroke: var(--ink-4); stroke-width: 1.2; stroke-dasharray: 2 4; }
.c-path { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.c-path.draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw .9s .15s cubic-bezier(.6, .1, .2, 1) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.c-head { fill: var(--ink); opacity: 0; animation: fadeIn .25s 1s forwards; }
.c-tag rect { fill: var(--ink); }
.c-tag text { fill: var(--bg); font: 650 10px var(--f-sans); letter-spacing: .06em; text-transform: uppercase; }
.c-tag { opacity: 0; animation: fadeIn .3s 1.05s forwards; }
.c-ripple { fill: none; stroke: var(--accent); stroke-width: 1.5; opacity: 0; transform-origin: center; transform-box: fill-box; animation: ripple 2.2s ease-out infinite; }
.c-ripple.r2 { animation-delay: .7s; } .c-ripple.r3 { animation-delay: 1.4s; }
@keyframes ripple { 0% { opacity: .75; transform: scale(.2); } 100% { opacity: 0; transform: scale(3.2); } }
@keyframes fadeIn { to { opacity: 1; } }
.c-lab {
  position: absolute; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 8px; border-radius: 12px;
  font: 700 11px/1 var(--f-sans); letter-spacing: .13em; text-transform: uppercase; color: var(--ink-2); transition: background .15s, color .15s;
}
.c-lab small { font: 500 10.5px/1.2 var(--f-sans); letter-spacing: .01em; text-transform: none; color: var(--ink-3); }
.c-lab:active { background: var(--surface); }
.c-lab.l { left: -6px; top: 50%; transform: translateY(-50%); align-items: flex-start; }
.c-lab.r { right: -6px; top: 50%; transform: translateY(-50%); align-items: flex-end; }
.c-lab.t { top: -2px; left: 50%; transform: translateX(-50%); }
.c-lab.b { bottom: -2px; left: 50%; transform: translateX(-50%); }
.c-lab.l, .c-lab.r { letter-spacing: .08em; }
.c-lab.l { color: var(--sour); } .c-lab.r { color: var(--bitter); } .c-lab.b { color: var(--weak); } .c-lab.t { color: var(--strong); }
.taste-words { text-align: center; margin-top: 8px; font: 500 italic 21px/1.25 var(--f-voice); min-height: 27px; color: var(--ink); }
.taste-words.placeholder { color: var(--ink-3); font-size: 17px; }
.taste-hint { text-align: center; font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }

/* ── Sheets ───────────────────────────────────────────────────────────────── */
.scrim { position: fixed; inset: 0; z-index: 60; background: var(--scrim); opacity: 0; transition: opacity .25s; }
.scrim.on { opacity: 1; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; max-height: 93vh; max-height: 93dvh; display: flex; flex-direction: column;
  background: var(--sheet); border-radius: 26px 26px 0 0; box-shadow: var(--shadow-sheet);
  transform: translateY(100%); transition: transform .32s cubic-bezier(.2, .8, .2, 1); max-width: 620px; margin: 0 auto;
}
.sheet.on { transform: none; }
.sheet-grab { flex-shrink: 0; display: flex; justify-content: center; padding: 10px 0 2px; cursor: grab; touch-action: none; }
.sheet-grab span { width: 40px; height: 4.5px; border-radius: 3px; background: var(--line-2); }
.sheet-hd { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 12px 6px var(--gutter); }
.sheet-title { font: 560 21px/1.2 var(--f-serif); font-variation-settings: 'opsz' 36; }
.sheet-bd { overflow-y: auto; overscroll-behavior: contain; padding: 4px var(--gutter) calc(24px + env(safe-area-inset-bottom, 0px)); -webkit-overflow-scrolling: touch; }
.sheet-ft { flex-shrink: 0; padding: 10px var(--gutter) calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; box-shadow: 0 -1px 0 var(--line); background: var(--sheet); }
.sheet-ft .btn { flex: 1; }
.option-list { display: flex; flex-direction: column; gap: 6px; }
.option {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 14px; border-radius: 16px; text-align: left; background: var(--surface); transition: background .15s;
}
.option[aria-pressed="true"] { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); }
.option .o1 { font: 650 15px/1.25 var(--f-sans); }
.option .o2 { font-size: 12.5px; color: var(--ink-3); margin-top: 3px; line-height: 1.4; }
.option .tick { margin-left: auto; color: var(--accent-ink); flex-shrink: 0; opacity: 0; }
.option[aria-pressed="true"] .tick { opacity: 1; }
.group-lab { font: 650 11px/1 var(--f-sans); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin: 16px 2px 8px; }
.group-lab:first-child { margin-top: 4px; }

/* ── Result ───────────────────────────────────────────────────────────────── */
.result { display: flex; flex-direction: column; gap: 14px; animation: viewIn .35s .2s both; }
.verdict-t { font: 580 27px/1.12 var(--f-serif); font-variation-settings: 'opsz' 72; letter-spacing: -.01em; text-wrap: balance; }
.verdict-l { font: 440 italic 17px/1.45 var(--f-voice); color: var(--ink-2); margin-top: 6px; }
.tone-sour .verdict-t { color: var(--sour); } .tone-bitter .verdict-t { color: var(--bitter); }
.tone-weak .verdict-t { color: var(--weak); } .tone-strong .verdict-t { color: var(--strong); }
.tone-dialed .verdict-t { color: var(--accent-ink); }
.tone-uneven .verdict-t, .tone-harsh .verdict-t, .tone-burnt .verdict-t { color: var(--bitter); }
.tone-flat .verdict-t, .tone-muddy .verdict-t, .tone-gritty .verdict-t, .tone-nofoam .verdict-t { color: var(--strong); }
.next-lab { display: flex; align-items: center; justify-content: space-between; }
.actions { display: flex; flex-direction: column; gap: 8px; }
.action { display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding: 14px 16px; border-radius: 18px; background: var(--surface); }
.action .n { width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font: 500 13px/1 var(--f-mono); }
.action .a1 { font: 650 16px/1.3 var(--f-sans); }
.action .a2 { font: 500 13.5px/1.3 var(--f-mono); color: var(--accent-ink); margin-top: 5px; letter-spacing: -.01em; }
.action .a2.plain { font-family: var(--f-sans); color: var(--ink-2); letter-spacing: 0; line-height: 1.45; }
.action .a3 { font-size: 13px; color: var(--ink-3); margin-top: 6px; line-height: 1.45; }
.disclose { border-radius: 18px; background: var(--surface); overflow: hidden; }
.disclose > button { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 15px 16px; font: 650 14px var(--f-sans); text-align: left; }
.disclose > button svg { transition: transform .2s; color: var(--ink-3); }
.disclose.open > button svg { transform: rotate(180deg); }
.disclose .inner { padding: 0 16px 16px; display: none; }
.disclose.open .inner { display: block; }
.also { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.also li { padding: 12px 0; border-top: 1px solid var(--line); }
.also li:first-child { border-top: 0; padding-top: 2px; }
.also .h { font: 650 14px/1.3 var(--f-sans); display: flex; align-items: center; gap: 8px; }
.also .h i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-4); flex-shrink: 0; }
.also .d { font-size: 13px; color: var(--ink-2); margin-top: 4px; line-height: 1.5; }
.cat-temp i { background: var(--bitter) !important; } .cat-prep i, .cat-pressure i { background: var(--weak) !important; }
.cat-bean i { background: var(--good) !important; } .cat-recipe i, .cat-milk i { background: var(--accent) !important; }
.cat-dose i, .cat-basket i, .cat-grinder i { background: var(--strong) !important; } .cat-water i, .cat-timer i, .cat-machine i, .cat-heat i { background: var(--ink-3) !important; }
.science p { margin: 0 0 8px; font-size: 13.5px; line-height: 1.55; color: var(--ink-2); }
.science .mono { font-size: 12.5px; }
.notes-list p { margin: 0 0 8px; font-size: 13.5px; line-height: 1.5; color: var(--ink-2); }
.progress { align-self: flex-start; }

/* ── Journal ──────────────────────────────────────────────────────────────── */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { padding: 14px 12px 12px; border-radius: 18px; background: var(--surface); }
.stat .v { font: 500 26px/1 var(--f-mono); letter-spacing: -.03em; }
.stat .k { font: 600 10.5px/1.2 var(--f-sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-top: 7px; }
.coffee-card { display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: 20px; background: var(--surface); width: 100%; text-align: left; }
.coffee-card .n1 { font: 560 19px/1.2 var(--f-serif); font-variation-settings: 'opsz' 36; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.coffee-card .n2 { font: 600 10.5px/1.3 var(--f-sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-top: 4px; }
.coffee-card .n3 { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.coffee-card .n3 .mono { font-size: 12.5px; }
.brew-row { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 12px 4px; border-top: 1px solid var(--line); width: 100%; text-align: left; }
.brew-row:first-child { border-top: 0; }
.brew-row .b1 { font: 600 14px/1.3 var(--f-sans); }
.brew-row .b2 { font: 500 12px/1.3 var(--f-mono); color: var(--ink-3); margin-top: 3px; }
.brew-row .b3 { font: 500 11.5px var(--f-mono); color: var(--ink-4); text-align: right; }
.empty-state { text-align: center; padding: 28px 20px 8px; color: var(--ink-3); display: flex; flex-direction: column; align-items: center; gap: 10px; line-height: 1.5; }
.empty-state .voice { font-size: 21px; color: var(--ink-2); display: block; margin-top: 6px; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink-3); font: 500 10px var(--f-mono); }
.chart .band { fill: var(--accent-soft); }
.chart .axis { stroke: var(--line-2); }
.chart .grid { stroke: var(--line); }
.chart .fit { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
.chart .pt { stroke: var(--surface); stroke-width: 2; }
.back { display: inline-flex; align-items: center; gap: 4px; font: 600 14px var(--f-sans); color: var(--ink-2); padding: 8px 0; }

/* ── Learn ────────────────────────────────────────────────────────────────── */
.learn-card { display: flex; gap: 14px; align-items: flex-start; padding: 16px; border-radius: 20px; background: var(--surface); width: 100%; text-align: left; }
.learn-card .l1 { font: 560 18.5px/1.2 var(--f-serif); font-variation-settings: 'opsz' 36; }
.learn-card .l2 { font-size: 13.5px; color: var(--ink-2); margin-top: 5px; line-height: 1.45; }
.learn-card .l3 { font: 500 11.5px var(--f-mono); color: var(--ink-4); margin-top: 8px; }
.learn-ico { width: 44px; height: 44px; border-radius: 14px; background: var(--bg); display: grid; place-items: center; color: var(--accent-ink); flex-shrink: 0; }
.article { max-width: 64ch; }
.article h1 { font: 560 32px/1.08 var(--f-serif); font-variation-settings: 'opsz' 96; letter-spacing: -.015em; margin: 6px 0 10px; text-wrap: balance; }
.article .lede { font: 440 italic 19px/1.45 var(--f-voice); color: var(--ink-2); margin: 0 0 18px; }
.article h2 { font: 580 21px/1.25 var(--f-serif); font-variation-settings: 'opsz' 36; margin: 26px 0 8px; text-wrap: balance; }
.article p, .article li { font-size: 16px; line-height: 1.62; color: var(--ink); }
.article p { margin: 0 0 12px; }
.article ul, .article ol { padding-left: 20px; margin: 0 0 12px; }
.article li { margin-bottom: 6px; }
.article b, .article strong { font-weight: 650; }
.article .tip { background: var(--accent-soft); border-radius: 16px; padding: 14px 16px; margin: 16px 0; font-size: 14.5px; line-height: 1.55; }
.article .tip b { color: var(--accent-ink); }
.fig { margin: 18px 0 20px; background: var(--surface); border-radius: 20px; padding: 16px 12px 12px; }
.fig svg { width: 100%; height: auto; display: block; max-width: 460px; margin: 0 auto; }
.fig figcaption { font-size: 12.5px; color: var(--ink-3); text-align: center; margin-top: 8px; line-height: 1.45; }
.fig text { font-family: var(--f-sans); }
.level-tag { display: inline-block; font: 650 10px/1 var(--f-sans); letter-spacing: .12em; text-transform: uppercase; color: var(--accent-ink); background: var(--accent-soft); padding: 5px 8px; border-radius: 999px; }

/* ── Setup ────────────────────────────────────────────────────────────────── */
.set-sec { background: var(--surface); border-radius: 20px; padding: 6px 16px; }
.set-sec h3 { font: 560 18px/1.2 var(--f-serif); font-variation-settings: 'opsz' 36; margin: 12px 0 2px; }
.set-sec .sub { font-size: 13px; color: var(--ink-3); margin: 2px 0 8px; line-height: 1.45; }
.set-row { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line); width: 100%; text-align: left; }
.set-row:first-of-type { border-top: 0; }
.set-row .r1 { font: 600 14.5px/1.3 var(--f-sans); }
.set-row .r2 { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; line-height: 1.4; }
.set-row .rv { margin-left: auto; font: 500 13.5px var(--f-sans); color: var(--ink-2); text-align: right; flex-shrink: 0; max-width: 55%; }
.care-due { color: var(--warn); font-weight: 650; }
.care-ok { color: var(--good); }
.level-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 6px 0 12px; }
.level-card { padding: 14px; border-radius: 16px; background: var(--bg); text-align: left; }
.level-card[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent); background: var(--accent-soft); }
.level-card .lc1 { font: 650 15px var(--f-sans); }
.level-card .lc2 { font-size: 12.5px; color: var(--ink-3); margin-top: 4px; line-height: 1.4; }
.about { text-align: center; padding: 20px 12px 8px; }
.about .wordmark { height: 40px; margin: 0 auto 8px; }
.about .pron { font: 440 italic 16px var(--f-voice); color: var(--ink-2); }
.about p { font-size: 13.5px; color: var(--ink-2); line-height: 1.55; max-width: 44ch; margin: 10px auto; }
.fine { font-size: 11.5px; color: var(--ink-4); text-align: center; margin: 6px 0; }

/* ── Onboarding ───────────────────────────────────────────────────────────── */
.onb { position: fixed; inset: 0; z-index: 80; background: var(--bg); display: flex; flex-direction: column; overflow-y: auto; }
.onb-in { flex: 1; width: 100%; max-width: 480px; margin: 0 auto; padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; }
.onb-hero { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 20px 0; }
.onb-hero .wordmark { height: 84px; margin-bottom: 8px; }
.onb-hero .pron { font: 440 italic 18px var(--f-voice); color: var(--ink-3); }
.onb h1 { font: 560 34px/1.08 var(--f-serif); font-variation-settings: 'opsz' 96; letter-spacing: -.015em; margin: 0; text-wrap: balance; }

.onb-steps { display: flex; gap: 6px; justify-content: center; }
.onb-steps i { width: 6px; height: 6px; border-radius: 3px; background: var(--line-2); transition: all .25s; }
.onb-steps i.on { width: 20px; background: var(--accent); }
.onb .choice { display: flex; flex-direction: column; gap: 10px; }
.onb .choice button { text-align: left; padding: 18px; border-radius: 20px; background: var(--surface); }
.onb .choice button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent); background: var(--accent-soft); }
.onb .choice .c1 { font: 560 20px/1.2 var(--f-serif); font-variation-settings: 'opsz' 36; }
.onb .choice .c2 { font-size: 14px; color: var(--ink-2); margin-top: 5px; line-height: 1.45; }
.onb-foot { display: flex; flex-direction: column; gap: 8px; }

/* ── Toast ────────────────────────────────────────────────────────────────── */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--nav-h) + 20px + env(safe-area-inset-bottom, 0px)); z-index: 90; transform: translate(-50%, 20px);
  background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 999px; font: 600 13.5px var(--f-sans); opacity: 0; pointer-events: none;
  transition: all .25s; max-width: calc(100% - 32px); text-align: center; box-shadow: var(--shadow);
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }


/* ── Taste sheet ──────────────────────────────────────────────────────────── */
.sheet.taste .compass-wrap { transition: width .45s cubic-bezier(.2, .8, .2, 1); }
.sheet.taste .compass { transition: top .45s cubic-bezier(.2, .8, .2, 1), bottom .45s cubic-bezier(.2, .8, .2, 1); }

.sheet.taste.result .compass { top: 4px; bottom: 4px; }
.sheet.taste.result .c-lab { opacity: 0; pointer-events: none; }
.flags { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 16px 0 4px; }
.flags .chip svg { width: 15px; height: 15px; }
.chip.ok[aria-pressed="true"] { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.measure { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin-top: 12px; padding: 10px; border-radius: 14px; background: var(--surface); font-size: 13px; color: var(--ink-2); }
.measure .link { padding: 0; }
.disclose.how { margin-top: 14px; background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.disclose.how > button { font-size: 13.5px; color: var(--ink-2); padding: 12px 14px; }
.taste-guide { margin: 0 0 10px; display: flex; flex-direction: column; gap: 8px; }
.taste-guide div { display: grid; grid-template-columns: 62px 1fr; gap: 10px; align-items: baseline; }
.taste-guide dt { font: 700 11px/1.3 var(--f-sans); letter-spacing: .1em; text-transform: uppercase; }
.taste-guide dd { margin: 0; font-size: 13.5px; line-height: 1.45; color: var(--ink-2); }
.disclose .inner > p { margin: 0; font-size: 13px; line-height: 1.5; color: var(--ink-3); }
.verdict { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.verdict .progress { margin-bottom: 8px; }
.verdict-l { margin: 6px 0 0; }
.dialed-card { background: color-mix(in srgb, var(--good) 11%, var(--surface)); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }

.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.notes-list { background: var(--surface); border-radius: 16px; padding: 12px 14px 4px; }
.notes-list.bean { background: none; padding: 10px 0 0; border-top: 1px solid var(--line); margin-top: 6px; }
.disclose .notes-list { background: none; padding: 0; }
.sheet-note { font-size: 12.5px; color: var(--ink-3); line-height: 1.5; margin: 14px 2px 6px; }
.sheet-note.first { margin-top: 0; }

/* ── Sheets: recipe, options, forms ───────────────────────────────────────── */
.stepper .val .grind-val { font: inherit; letter-spacing: -.02em; padding: 6px 8px; border-radius: 10px; background: var(--surface); border-bottom: 1.5px dashed var(--line-2); }
.grind-in { width: 104px !important; min-height: 40px !important; padding: 6px 8px !important; text-align: center; font: 500 18px var(--f-mono) !important; }

.chips.grind-labels .chip { padding: 8px 11px; }
.field-sub.pad { margin: 8px 2px 0; }
.notice.slim { padding: 11px 14px; margin-bottom: 10px; }
.option .meta { font: 500 12px var(--f-mono); color: var(--ink-3); margin-left: 6px; letter-spacing: -.01em; white-space: nowrap; }
.option-wrap { display: flex; flex-direction: column; gap: 8px; }
.option-wrap .chips.recipes { padding: 0 6px 6px 56px; }
.m-ico { width: 36px; height: 36px; border-radius: 12px; background: var(--bg); color: var(--accent-ink); display: grid; place-items: center; flex-shrink: 0; }

.group-note { font-size: 12.5px; color: var(--ink-3); margin: -2px 2px 10px; line-height: 1.45; }
.opt-row { display: flex; align-items: center; gap: 6px; }
.opt-row .option { flex: 1; min-width: 0; }

.form-more { margin-top: 18px; }

.form-more .disclose > button .muted { font-weight: 500; margin-left: 6px; }
.form-more .inner label.lab:first-child { margin-top: 2px; }
.form-more .field { border-top: 0; padding: 14px 0 2px; }
.date-row { margin-top: 10px; }
.danger-zone { display: flex; gap: 8px; justify-content: space-between; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); }
.btn.danger { color: var(--bitter); }
.btn.danger-fill { background: var(--bitter); color: #fff; box-shadow: none; }
.confirm { margin-top: 12px; padding: 14px 16px; border-radius: 16px; background: color-mix(in srgb, var(--bitter) 10%, var(--surface)); }
.confirm p { margin: 0 0 12px; font-size: 14px; line-height: 1.45; }

.tds-in { width: 104px !important; text-align: center; font-family: var(--f-mono) !important; }
.brew .notice + .notice { margin-top: -4px; }
.gear-note { margin-top: 10px; font-size: 12.5px; line-height: 1.45; color: var(--warn); }

/* ── Journal ──────────────────────────────────────────────────────────────── */
.center { text-align: center; justify-content: center; }
.small { font-size: 12.5px; line-height: 1.5; }
.card.list { padding: 4px 14px; }
.brew-row .b0 { font: 650 10px/1.2 var(--f-sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brew-row .b1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brew-row .b1.ok { color: var(--good); }
.brew-row .b2 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bmini, .cmini { display: grid; place-items: center; }
.coffee-card .n3 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ok-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); display: inline-block; }
.cd-head { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.cd-head .page-title { margin-bottom: 0; }
.cd-roaster { font-size: 14px; color: var(--ink-2); }
.cd-hero { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 0 4px; }
.cd-hero svg.trail { max-width: 100%; height: auto; }
.trail .tl { font: 700 8.5px var(--f-sans); letter-spacing: .12em; }
.cd-cap { margin: 0; font: 440 italic 15px/1.4 var(--f-voice); color: var(--ink-2); text-align: center; }
.chips.center { justify-content: center; }
.recipes-card { display: flex; flex-direction: column; gap: 4px; }
.rec-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.recipes-card .eyebrow + .rec-row { border-top: 0; }
.rec-row .r1 { font: 650 14.5px/1.3 var(--f-sans); }
.rec-row .r2 { font-size: 13px; color: var(--accent-ink); margin-top: 3px; }
.rec-row .r3 { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.calib .chart { margin: 8px 0 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11.5px; color: var(--ink-3); margin: 4px 0; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.legend i.band-key { border-radius: 3px; background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.calib p { margin: 6px 0 0; }
.notes-card p { margin: 8px 0 0; font-size: 14px; line-height: 1.55; color: var(--ink-2); white-space: pre-wrap; }
.cd-actions { gap: 8px; margin-top: 4px; }
.cd-actions .btn.grow { flex: 1; }
.bd-head { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.bd-words { font: 500 italic 20px/1.25 var(--f-voice); }
.bd-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 4px; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kv > div { background: var(--surface); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.kv .k { font: 600 10px/1 var(--f-sans); letter-spacing: .11em; text-transform: uppercase; color: var(--ink-3); }
.kv .v { font: 500 15px/1.2 var(--f-mono); margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bd-verdict { font: 580 17px/1.3 var(--f-serif); margin: 16px 0 0; }
.fix-list { margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.5; color: var(--ink-2); }
.fix-list li { margin-bottom: 4px; }

/* ── Learn ────────────────────────────────────────────────────────────────── */
.page-lede { margin: 0 0 4px; font: 440 italic 17px/1.45 var(--f-voice); color: var(--ink-2); }
.learn-card.next { align-items: center; margin-top: 10px; }
.learn-card .l3.top { margin: 0 0 4px; text-transform: uppercase; letter-spacing: .12em; font: 650 10px var(--f-sans); color: var(--ink-3); }

/* ── Setup ────────────────────────────────────────────────────────────────── */
.set-sec > label.lab:first-of-type { margin-top: 8px; }
.set-sec select + .field, .set-sec .sub + .field { border-top: 0; }
.sub.note { margin: 8px 2px 10px; }
.sub.note.warn { color: var(--warn); }
select.inline { width: auto; min-width: 150px; min-height: 40px; padding: 6px 36px 6px 12px; }
.set-row .btns { display: flex; gap: 6px; flex-shrink: 0; }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 0; }
.import-box { padding: 4px 0 12px; display: flex; flex-direction: column; gap: 8px; }
.import-box textarea { min-height: 110px; font: 12px/1.4 var(--f-mono); }
.import-box .row { justify-content: flex-end; }
.zones { padding: 12px 0 4px; display: flex; flex-direction: column; gap: 8px; }
.z-row { display: flex; align-items: center; gap: 8px; }
.z-row .z-lab { width: 80px; font: 600 13.5px var(--f-sans); }
.z-row input { width: 84px; min-height: 40px; text-align: center; font-family: var(--f-mono); }
.z-row span:not(.z-lab) { color: var(--ink-3); font-size: 13px; }
.set-sec textarea, .set-sec input[type=email] { margin-top: 6px; }
.fb-row { padding: 10px 0 14px; }
.fb-status { font-size: 13px; color: var(--ink-3); }
.fb-status.ok { color: var(--good); } .fb-status.warn { color: var(--bitter); }

body.onb-open { overflow: hidden; }
.onb { transition: opacity .3s, transform .3s; }
.onb.out { opacity: 0; transform: scale(1.02); pointer-events: none; }
.onb-top { display: flex; align-items: center; justify-content: space-between; }
.onb-q { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; }
.onb-demo { display: flex; justify-content: flex-start; padding-top: 6px; }
.onb-fields { display: flex; flex-direction: column; }
.onb-fields .sub { font-size: 13px; color: var(--ink-3); margin: 12px 2px 0; line-height: 1.45; }
.onb-how { list-style: none; counter-reset: s; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.onb-how li { counter-increment: s; position: relative; padding: 16px 16px 16px 58px; border-radius: 20px; background: var(--surface); font-size: 15.5px; line-height: 1.45; color: var(--ink-2); }
.onb-how li::before { content: counter(s); position: absolute; left: 16px; top: 15px; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font: 500 13px/1 var(--f-mono); }
.onb-how b { color: var(--ink); }
.onb-foot { margin-top: auto; }

@media (min-width: 700px) {
  .main { padding-top: 12px; }
  .readout .num { font-size: 44px; }
}
@media (max-width: 360px) {
  .readout .num { font-size: 32px; }

  .dial .face { width: 134px; height: 134px; }
  .specs { gap: 6px; }
  .spec { padding: 10px 9px 9px; }
  .spec .v { font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  .c-path.draw { stroke-dashoffset: 0; }
  .c-head, .c-tag { opacity: 1; }
  .c-ripple { display: none; }
}

.wordmark { aspect-ratio: var(--wm-ar, 2.4); }

.action .a2.plain { word-spacing: normal; }
.set-sec .btn.quiet, .card .btn.quiet { background: var(--bg); }
.measure .m-v { color: var(--ink); font-weight: 600; }
.measure .m-v .mono { font-weight: 500; }
.dial .wl { position: absolute; font: 500 10.5px/1 var(--f-mono); color: var(--ink-3); transform: translate(-50%, -50%); pointer-events: none; white-space: nowrap; }
.dial.in .wl, .dial.running .wl { color: var(--ink-2); }
.onb-hero.center { align-items: center; text-align: center; gap: 12px; }
.onb-hero.center .wordmark { height: 46px; margin: 0; }
.onb-hero.center h1 { font-size: 31px; max-width: 13em; }
.onb-hero.center .lead { max-width: 24em; }
.hero-compass { width: min(76vw, 292px); margin: 4px 0 8px; }
.hero-compass svg { width: 100%; height: auto; display: block; overflow: visible; }
.h-disc { fill: var(--surface); }
.h-ring { fill: none; stroke: var(--line-2); }
.h-ring.faint { stroke: var(--line); }
.h-axis { stroke: var(--line); stroke-dasharray: 2 5; }
.h-sweet { fill: var(--accent-soft); stroke: var(--accent); stroke-dasharray: 3 4; }
.h-path { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: hdraw 1.5s .9s cubic-bezier(.6, .1, .2, 1) forwards; }
@keyframes hdraw { to { stroke-dashoffset: 0; } }
.h-dot { fill: var(--accent); filter: drop-shadow(0 3px 6px rgba(0, 0, 0, .22)); animation: hdot .5s 2.35s forwards; }
@keyframes hdot { to { fill: var(--good); } }
.h-ghost { fill: var(--ink-4); opacity: 0; animation: fadeIn .4s .9s forwards; }
.h-tag { opacity: 0; animation: fadeIn .35s forwards; }
.h-tag rect { fill: var(--ink); } .h-tag text { fill: var(--bg); font: 650 9.5px var(--f-sans); letter-spacing: .08em; }
.h-lab { font: 700 8px var(--f-sans); letter-spacing: .14em; }
.h-ripple { fill: none; stroke: var(--good); stroke-width: 1.4; opacity: 0; transform-origin: center; transform-box: fill-box; animation: ripple 2.4s 2.5s ease-out infinite; }
.h-ripple.r2 { animation-delay: 3.3s; }
@media (prefers-reduced-motion: reduce) { .h-path { stroke-dashoffset: 0; } .h-ghost, .h-tag { opacity: 1; } .h-dot { fill: var(--good); } }
.recipe-top .eyebrow b { color: var(--ink-2); font-weight: 650; }
.sheet:focus { outline: none; }
.sheet-ft .btn.quiet { flex: 0 1 auto; padding: 0 18px; }
.sheet-ft .btn:not(.quiet) { flex: 1 1 auto; }
@media (max-width: 370px) { .sheet-ft .btn { font-size: 14px; } }

/* engine.js */
/* ─────────────────────────────────────────────────────────────────────────────
   Ćejf · diagnostic engine
   Pure functions over data.js. No DOM, no storage. Unit-tested in Node.

   The taste compass
     x ∈ [-1, 1]  extraction as tasted:  −1 very sour (under) … +1 very bitter (over)
     y ∈ [-1, 1]  strength as tasted:    −1 very weak … +1 very strong
   A fix is a movement (Δx, Δy) back to (0, 0). Each lever moves the cup along its
   own vector, e.g. espresso: finer grind ≈ (+1, +0.25), more yield ≈ (+0.5, −1).
   Solving the 2×2 system tells us how much of each lever to use; measured time,
   roast, freshness and history then gate or override that answer.
   ───────────────────────────────────────────────────────────────────────────── */

const Engine = (() => {
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const roundTo = (v, step) => Math.round(v / step) * step;
  const tidy = v => Math.round(v * 1000) / 1000;
  const cap = s => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);
  const plural = (n, word) => {
    if (word === 'notch') return n === 1 ? 'notch' : 'notches';
    return n === 1 ? word : word + 's';
  };
  const DAY = 86400000;

  /* ── Grinders ─────────────────────────────────────────────────────────── */
  function grinder(id) {
    const key = (typeof GRINDER_ALIASES !== 'undefined' && GRINDER_ALIASES[id]) || id;
    return GRINDERS[key] || GRINDERS.other_grinder;
  }
  function grinderId(id) {
    const key = GRINDER_ALIASES[id] || id;
    return GRINDERS[key] ? key : 'other_grinder';
  }

  /* All zones for a grinder, deriving the missing ones from espresso + pour over.
     overrides: { esp:[a,b], po:[a,b] } set by the user for their own grinder. */
  function zones(g, overrides) {
    const z = Object.assign({}, g.zones, overrides || {});
    if (g.preground) return z;
    const e = z.esp, p = z.po;
    const r = v => roundTo(v, g.step);
    if (e && p) {
      const es = e[1] - e[0], ps = p[1] - p[0];
      if (!z.tk) z.tk = [r(Math.max(0, e[0] * 0.75)), r(e[0] + 0.3 * es)];
      if (!z.moka) z.moka = e[1] * 1.2 < p[0] ? [r(e[1] * 1.2), p[0]] : [e[1], p[0]];
      if (!z.aero) z.aero = [r((e[1] + p[0]) / 2), r(p[0] + 0.15 * ps)];
      if (!z.fp) z.fp = [r(p[0] * 1.5), r(Math.min(g.max, p[1] * 1.4))];
    }
    return z;
  }
  function zone(g, key, overrides) { return zones(g, overrides)[key] || null; }
  /* Can this grinder make this method's grind? */
  function canGrind(g, key, overrides) {
    if (g.preground) return false;
    if (g.espOnly && key !== 'esp') return false;
    return !!zone(g, key, overrides);
  }

  function fmtGrind(g, v) {
    if (v === null || v === undefined || Number.isNaN(v)) return '—';
    const f = g.fmt || ['dec', 1];
    if (f[0] === 'rnt') {
      const c = Math.max(0, Math.round(v)), cpr = f[1], cpn = f[2];
      return Math.floor(c / cpr) + '.' + Math.floor((c % cpr) / cpn) + '.' + (c % cpn);
    }
    if (f[0] === 'int') return String(Math.round(v));
    if (f[0] === 'third') {
      const n = Math.round(v * 3), w = Math.floor(n / 3), fr = n % 3;
      return (w || fr === 0 ? String(w) : '') + ['', '⅓', '⅔'][fr];
    }
    if (f[0] === 'label') return GRIND_LABELS[clamp(Math.round(v), 0, GRIND_LABELS.length - 1)];
    const s = Number(v).toFixed(f[1] || 1);
    return s.replace(/\.0+$/, '');
  }
  /* "4 clicks", "1.5 numbers", "2 notches" */
  function grindAmount(g, delta) {
    const d = Math.abs(delta);
    const f = g.fmt || ['dec', 1];
    if (f[0] === 'third') { const n = Math.round(d * 3); return n + ' ' + plural(n, 'notch'); }
    if (f[0] === 'dec') {
      const s = d.toFixed(f[1] || 1).replace(/\.0+$/, '');
      return s + ' ' + plural(Number(s), g.unit);
    }
    const n = Math.round(d / g.step);
    return n + ' ' + plural(n, g.unit);
  }
  /* Plain-language band for any setting, e.g. "fine". */
  function grindBand(g, v, overrides) {
    if (g.preground) return GRIND_LABELS[clamp(Math.round(v), 0, 6)];
    const z = zones(g, overrides);
    const order = [['tk', 0], ['esp', 1], ['moka', 2], ['aero', 2], ['po', 3], ['fp', 5]];
    let best = null, bestD = Infinity;
    for (const [k, lab] of order) {
      const r = z[k]; if (!r) continue;

  /* ── Methods & recipes ────────────────────────────────────────────────── */

  function recipeId(methodId, id) {

  function family(methodId) {

  /* ── Bean context ─────────────────────────────────────────────────────── */

    const R = ROASTS[roastKey] || null;
    const O = ORIGINS[b.origin] || null;
    const V = VARIETIES[b.variety] || null;
    const P = PROCESSES[b.process] || PROCESSES.unknown;
    let age = null;
    if (b.roastDate) {
      const t = Date.parse(b.roastDate);
      if (!Number.isNaN(t)) age = Math.max(0, Math.floor(((now || Date.now()) - t) / DAY));
    } else if (typeof b.ageDays === 'number') age = b.ageDays;
    const dens = O ? (O.density === 'high' ? 1 : O.density === 'low' ? -1 : 0) : 0;
    return {
      roast: R ? roastKey : null, roastName: R ? R.name : null,
      L: R ? R.L : 0, known: !!R,
      origin: O ? b.origin : null, originName: O ? O.name : null, O,
      variety: V ? b.variety : null, V, vd: V ? V.d : 0,
      process: PROCESSES[b.process] ? b.process : 'unknown', P, px: P.ex || 0,

  /* ── Starting recipe ──────────────────────────────────────────────────── */
  /* ctx: { method, recipeId, bean, gear:{grinder, zoneOverrides, basket, machine, basketType}, drink, prefs:{dose} } */
  function start(ctx) {
    const mId = ctx.method, M = method(mId), rid = recipeId(mId, ctx.recipeId), R = recipe(mId, rid);
    const fam = family(mId);
    const gear = ctx.gear || {};
    const g = grinder(gear.grinder);
    const bi = beanInfo(ctx.bean, ctx.now);
    const reasons = [];
    const mc = MACHINES[gear.machine] || MACHINES.other_machine;
    const p = {};

    if (fam === 'espresso') {
      p.dose = Number(gear.basket) || 18;
      let ratio = R.ratio;
      if (rid === 'classic' || rid === 'lungo') {
        const adj = { 2: 0.2, 1: 0.1, 0: 0, '-1': -0.1, '-2': -0.2 }[bi.L] || 0;

      if (bi.px >= 0.5) t -= 1;

      if (fam === 'espresso' && mc.temp === false) p.temp = null;

    }
    if (bi.known && bi.L !== 0) {
      const parts = bi.L > 0 ? ['finer'] : ['coarser'];
      if (fam !== 'turkish' && fam !== 'moka') parts.push(bi.L > 0 ? 'hotter' : 'cooler');
      if (fam === 'espresso' && (rid === 'classic' || rid === 'lungo')) parts.push(bi.L > 0 ? 'a slightly longer ratio' : 'a slightly shorter ratio');

    }

    /* grind */
    const zkey = M.zone;
    if (canGrind(g, zkey, gear.zoneOverrides)) {
      const z = zone(g, zkey, gear.zoneOverrides);
      let pos = M.pos + (R.pos || 0);
      pos += -0.06 * bi.L;
      pos += -0.05 * bi.density;
      pos += 0.04 * bi.px;
      if (bi.decaf) pos += 0.05;
      const st = ageState(bi.age, fam);
      if (st === 'fresh') { pos += 0.05; reasons.push('Very fresh beans hold CO₂, so start a little coarser'); }
      else if (st === 'old') { pos -= 0.04; reasons.push('Older beans extract less, so start a little finer'); }
      else if (st === 'stale') { pos -= 0.08; reasons.push('Beans past two months: a finer grind helps, fresh beans help more'); }
      if (bi.density >= 0.9) reasons.push('High-grown, dense beans: a touch finer');
      else if (bi.density <= -0.6) reasons.push((bi.V && bi.vd < 0 ? bi.variety : 'Soft, porous') + ' beans extract fast: a touch coarser');
      pos = clamp(pos, 0.03, 0.97);
      p.grind = tidy(roundTo(z[0] + pos * (z[1] - z[0]), g.step));
    } else {
      p.grind = M.pg;
    }
    return { params: p, reasons: reasons.slice(0, 4), recipeId: rid };
  }

  /* ── Grind sensitivity (seconds of time per grinder step) ───────────────
     Heuristic: a grinder's espresso zone spans roughly 35 s of shot time, a
     pour-over zone roughly 120 s of drawdown. With ≥2 logged brews at different

    const fam = family(ctx.method);
    const g = grinder(ctx.gear && ctx.gear.grinder);

    const z = zone(g, key, ctx.gear && ctx.gear.zoneOverrides) || [0, 10];
    const span = Math.max(g.step * 4, z[1] - z[0]);
    const across = fam === 'espresso' ? 35 : 120;

    if (fam === 'espresso' && ctx.gear && ctx.gear.basketType === 'pressurized') heur *= 0.35;
    const out = { sPerStep: heur, basis: 'estimate', n: 0, heuristic: heur };
    const hist = (ctx.history || []).filter(h => typeof h.grind === 'number' && typeof h.time === 'number' && h.time > 0).slice(0, 8);
    const distinct = new Set(hist.map(h => h.grind));
    if (hist.length >= 2 && distinct.size >= 2) {
      const n = hist.length;
      const mx = hist.reduce((s, h) => s + h.grind, 0) / n, my = hist.reduce((s, h) => s + h.time, 0) / n;
      let sxy = 0, sxx = 0;
      for (const h of hist) { sxy += (h.grind - mx) * (h.time - my); sxx += (h.grind - mx) ** 2; }
      const slope = sxx > 0 ? sxy / sxx : 0;              // seconds per unit; negative = finer is slower
      const perStep = Math.abs(slope) * g.step;

      }

  }

  /* ── Words for a compass position ─────────────────────────────────────── */
  function degree(v) { const a = Math.abs(v); return a < 0.15 ? '' : a < 0.4 ? 'a little' : a < 0.7 ? 'quite' : 'very'; }
  function describe(x, y, flags, fam) {
    const parts = [];
    const dx = degree(x), dy = degree(y);
    if (dx) parts.push(dx + ' ' + (x < 0 ? 'sour' : 'bitter'));
    if (dy) parts.push((dy === 'a little' ? 'a bit' : dy) + ' ' + (y < 0 ? (fam === 'turkish' ? 'thin' : 'weak') : (fam === 'turkish' ? 'heavy' : 'strong')));
    const fl = (flags || []).map(f => FLAGS[f] && FLAGS[f].short.toLowerCase()).filter(Boolean);
    if (!parts.length && fl.length) return cap(fl.join(', '));
    let s = parts.length ? cap(parts.join(', ')) : 'Balanced and sweet';
    if (fl.length) s += ' · ' + fl.join(', ');
    return s;
  }

  /* ── Diagnosis ────────────────────────────────────────────────────────── */
  /* 2×2 solve: a·A + b·B = (ex, st) */
  function solve(A, B, ex, st) {

    pourover: { grind: [1, 0.2], dose: [-0.3, 1], temp: [0.3, 0.05] },
    immersion: { steep: [1, 0.15], grind: [1, 0.2], dose: [-0.25, 1] },

            bean, gear, drink, taste:{x,y,flags[]}, history:[newest first], now } */
  function diagnose(ctx) {
    const mId = ctx.method, M = method(mId), fam = family(mId);
    const rid = recipeId(mId, ctx.recipeId), R = recipe(mId, rid);
    const gear = ctx.gear || {};
    const g = grinder(gear.grinder);
    const zkey = M.zone;
    const hasGrinder = canGrind(g, zkey, gear.zoneOverrides) && typeof (ctx.params || {}).grind === 'number';
    const mc = MACHINES[gear.machine] || MACHINES.other_machine;
    const P = Object.assign({}, ctx.params);
    const bi = beanInfo(ctx.bean, ctx.now);
    const tz = ctx.taste || {};
    const x = clamp(Number(tz.x) || 0, -1, 1), y = clamp(Number(tz.y) || 0, -1, 1);
    const flags = new Set((tz.flags || []).filter(f => flagsFor(mId).includes(f)));
    const d = Math.min(1, Math.hypot(x, y));
    const hist = ctx.history || [];
    const W = windowOf(mId, rid);
    const t = typeof P.time === 'number' && P.time > 0 ? P.time : null;
    const pressurized = fam === 'espresso' && gear.basketType === 'pressurized';
    const tol = fam === 'espresso' ? (pressurized ? 5 : 1) : 10;
    const timed = W && t !== null && (M.time === 'shot' || M.time === 'drawdown' || M.time === 'steep');
    let tState = 'unknown';
    if (timed) tState = t < W[0] - tol ? 'fast' : t > W[1] + tol ? 'slow' : 'ok';
    const tMid = W ? (W[0] + W[1]) / 2 : null;
    const veryFast = timed && tState === 'fast' && t < W[0] * 0.6;
    const age = ageState(bi.age, fam);
    const sens = hasGrinder && (M.time === 'shot' || M.time === 'drawdown') ? sensitivity(ctx) : null;
    const tempCtl = fam === 'espresso' ? mc.temp : true;       // null = unknown machine
    const hasTemp = typeof P.temp === 'number' && tempCtl !== false;
    const superauto = fam === 'espresso' && !!mc.superauto;
    const shot = fam === 'espresso' ? 'shot' : 'brew';

    const res = {
      method: mId, family: fam, recipeId: rid, window: W, time: t, tState,
      taste: { x, y, flags: [...flags], d, words: describe(x, y, [...flags], fam) },
      verdict: null, actions: [], also: [], notes: [], beanNotes: [], science: [],
      next: Object.assign({}, P), dialed: false, calibration: sens, progress: null, gate: null,
    };
    const science = s => res.science.push(s);
    const also = (cat, title, detail, score) => { if (!res.also.some(a => a.title === title)) res.also.push({ cat, title, detail, score: score || 0 }); };
    const add = (a) => { res.actions.push(a); if (a.change) Object.assign(res.next, a.change); };

    /* ─ lever helpers ─ */
    const z = hasGrinder ? zone(g, zkey, gear.zoneOverrides) : null;
    const zspan = z ? Math.max(g.step, z[1] - z[0]) : 0;
    function grindAction(steps, why, coef, opts) {

      const n = clamp(Math.round(Math.abs(steps)), 1, maxSteps);
      const dir = steps > 0 ? 'finer' : 'coarser';
      const delta = (steps > 0 ? -1 : 1) * n * g.step;
      const to = tidy(clamp(roundTo(P.grind + delta, g.step), 0, g.max));
      if (to === P.grind) return false;
      const edge = z && (to < z[0] - zspan * 0.2 || to > z[1] + zspan * 0.2);
      const verb = superauto ? 'Set the grinder ' : 'Grind ';
      add({
        lever: 'grind', dir, title: verb + grindAmount(g, delta) + ' ' + dir,
        detail: fmtGrind(g, P.grind) + ' → ' + fmtGrind(g, to) + (opts.suffix || ''),
        why, vec: coef != null ? [VECS().grind[0] * coef, VECS().grind[1] * coef] : null,
        change: { grind: to }, edge,
      });

      const across = fam === 'espresso' ? 35 : 120;

      const target = clamp(ratio + dRatio, lo, hi);
      let to = Math.round(P.dose * target);
      if (to === P.out) to = P.out + (dRatio > 0 ? 1 : -1);
      if (to / P.dose > hi + 0.05 || to / P.dose < lo - 0.05) return false;
      const more = to > P.out;
      const title = superauto ? (more ? 'Choose a larger cup volume' : 'Choose a smaller cup volume')
        : (more ? 'Pull a little longer' : 'Stop the shot earlier');
      add({
        lever: 'yield', dir: more ? 'more' : 'less', title,
        detail: P.out + ' g → ' + to + ' g out (1:' + (to / P.dose).toFixed(1) + ')',
        why, vec: coef != null ? [VECS().yield[0] * coef, VECS().yield[1] * coef] : null,
        change: { out: to },
      });
      return true;
    }
    function doseAction(frac, why, coef) {
      const step = 0.5;
      let to = tidy(roundTo(P.dose * (1 + frac), step));
      if (to === P.dose) to = tidy(P.dose + (frac > 0 ? step : -step));
      if (to <= 0) return false;
      const more = to > P.dose;
      add({
        lever: 'dose', dir: more ? 'more' : 'less', title: more ? 'Use a little more coffee' : 'Use a little less coffee',
        detail: P.dose + ' g → ' + to + ' g coffee' + (P.out ? ' for ' + P.out + ' g water' : ''),
        why, vec: coef != null && VECS().dose ? [VECS().dose[0] * coef, VECS().dose[1] * coef] : null,

          : 'Your machine has no temperature control. Flush for 3–5 s before the shot to cool the group, or wait a minute after steaming.';

      const offset = fam === 'espresso' && (tempCtl === 'offset' || tempCtl === 'mode');
      const title = offset ? (delta > 0 ? 'Raise the temperature setting one step' : 'Lower the temperature setting one step')
        : (delta > 0 ? 'Brew ' + Math.abs(to - P.temp) + ' °C hotter' : 'Brew ' + Math.abs(to - P.temp) + ' °C cooler');
      const item = { lever: 'temp', dir: delta > 0 ? 'hotter' : 'cooler', title, detail: offset ? (delta > 0 ? 'One step up from where it is now' : 'One step down from where it is now') : P.temp + ' °C → ' + to + ' °C', why,
        vec: [(VECS().temp || [0.3, 0])[0] * Math.sign(delta) * 0.35, 0], change: { temp: to } };
      if (asAlso) also('temp', title, why + (offset ? '.' : ' (' + item.detail + ').'), 4);

    }

      if (d < pd - 0.1) res.progress = 'closer';
      else if (d > pd + 0.1) res.progress = 'further';

    if (W && t !== null) {
      const f = s => fam === 'espresso' ? String(Math.round(s)) : Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0');
      const u = fam === 'espresso' ? ' s' : '';
      science(cap(shot) + ' time ' + f(t) + u + ' against the ' + (R.label || '') + ' window of ' + f(W[0]) + '–' + f(W[1]) + u +
        (tState === 'fast' ? ': fast.' : tState === 'slow' ? ': slow.' : ': in the window.'));
    } else if (W && fam === 'espresso') {

    }

      const flow = P.out / Math.max(1, t - (rid === 'blooming' ? 30 : 4));

      science('Average flow about ' + res.flow + ' g/s once dripping.');
    }
    if (sens) {
      if (sens.basis === 'learned') science('Grind sensitivity on this coffee, learned from ' + sens.n + ' brews: about ' + sens.sPerStep.toFixed(1) + ' s per ' + g.unit + '.');
      else if (sens.basis === 'inconsistent') science('Your logged brews on this coffee don’t show a consistent grind-to-time pattern yet, so Ćejf uses its estimate for this grinder (' + sens.sPerStep.toFixed(1) + ' s per ' + g.unit + ').');
      else science('Grind sensitivity estimated from this grinder’s range: about ' + sens.sPerStep.toFixed(1) + ' s per ' + g.unit + '. Two brews at different settings let Ćejf measure it.');
