      if (ey > 21 && x < -0.3) res.notes.push('The cup tastes sour but the extraction yield is high. That points to uneven extraction rather than too little extraction.');
      if (ey < 18 && x > 0.3) res.notes.push('The cup tastes bitter but the extraction yield is low. The bitterness is more likely from the roast, heat or channeling than from over-extraction.');
    }

    /* ─ bean notes ─ */
    if (bi.O && bi.O.tip) res.beanNotes.push(bi.originName + ': ' + bi.O.tip);
    if (bi.V && Math.abs(bi.vd) >= 0.5) res.beanNotes.push(bi.variety + ': ' + bi.V.note);
    if (bi.P && bi.P.note && bi.process !== 'unknown' && bi.process !== 'washed') res.beanNotes.push(bi.P.name + ' process: ' + bi.P.note);
    if (bi.process === 'washed' && x < -0.15 && x > -0.45) res.notes.push('Washed coffees are naturally bright. If the acidity tastes clean and juicy rather than sharp, you may already be close.');

    /* ─ common “also” items ─ */
    if (age === 'fresh') also('bean', 'Give the beans a few more days', 'Roasted ' + bi.age + ' days ago. Fresh coffee is full of CO₂, which pushes water around the grounds and makes shots uneven. ' + (fam === 'espresso' ? 'Espresso usually tastes best from about 7 to 30 days after roast.' : 'Filter usually tastes best from about 4 days after roast.'), 5);
    if (age === 'old' || age === 'stale') also('bean', 'Your beans are getting old', 'Roasted ' + bi.age + ' days ago. Aromatics fade and the cup flattens. Grind a little finer to compensate, and plan a fresh bag.', age === 'stale' ? 6 : 3);
    if (pressurized) also('basket', 'Pressurized basket', 'A double-wall basket builds pressure on its own, so grind changes do little. For real control, switch to a single-wall basket.', 2);
    if (fam === 'espresso' && P.dose && gear.basket && Math.abs(P.dose - gear.basket) >= 2)
      also('dose', 'Match the dose to your basket', P.dose + ' g in an ' + gear.basket + ' g basket. ' + (P.dose < gear.basket ? 'A thin puck lets water rush through.' : 'An overfilled puck touches the shower screen and channels.') + ' Stay within about 1 g of the basket size.', 3);
    if (fam === 'espresso' && mc.note && mc.preinf === 'manual' && (flags.has('uneven') || flags.has('harsh'))) also('machine', MACHINES[gear.machine].name, mc.note, 1);
    if (fam === 'espresso' && ctx.drink === 'milk' && y < -0.15) also('milk', 'Make it stand up to milk', 'Milk mutes coffee. A shorter ratio (about 1:1.8–2) keeps the flavour from getting lost.', 5);
    if (fam === 'espresso' && !t) also('timer', 'Time the next shot', 'Tap the timer when you start the pump. With a time, Ćejf can size the grind change exactly.', 1);

    /* ═══ 1. Dialed in ═══ */
    if (d < 0.15 && flags.size === 0) {
      res.dialed = true;
      res.verdict = { tone: 'dialed', title: 'Dialed in.', line: 'Sweet and balanced. This is your recipe for this coffee, and Ćejf has saved it.' };
      if (tState === 'fast' || tState === 'slow') res.notes.unshift('It ran ' + (tState === 'fast' ? 'faster' : 'slower') + ' than the usual window, but taste wins. Keep it.');
      res.also = res.also.filter(a => a.cat === 'bean' || a.cat === 'milk');
      return finish();
    }

    /* ═══ 2. Family-specific flags that override the compass ═══ */
    if (fam === 'espresso') {
      const harshSour = flags.has('harsh') && x < -0.3;
      if (flags.has('uneven') || harshSour) {
        res.gate = 'uneven';
        if (veryFast) {
          res.verdict = v('uneven', 'Gushing and uneven.', 'With so little resistance, water blasts through a few channels. Those over-extract while the rest of the puck barely starts.');
          grindAction(stepsFor(tMid - t), 'A finer grind rebuilds resistance so water spreads through the whole puck.', null);
          prepAction('Channels form where the grounds are clumpy or uneven.');
        } else if (bi.L >= 0 || !bi.known) {
          res.verdict = v('uneven', bi.known ? 'Too fine for this roast.' : 'Probably ground too fine.', 'Lighter roasts ground fine enough to chase a long, thick shot pack almost solid. Water forces a few paths through: those over-extract (bitter) while the rest stays under-extracted (sour).');
          const dt = tState === 'slow' ? tMid - t : -Math.max(5, (W ? W[1] - W[0] : 10) * 0.5);
          grindAction(stepsFor(dt), 'Coarser grounds let water through evenly. It will run faster and look less pretty. Judge it by taste.', null);
          yieldAction(0.5, 'A longer ratio keeps total extraction up while the grind opens.', null);
          if (bi.L >= 1 && rid !== 'turbo') also('recipe', 'Try the Turbo style', 'Coarse, fast and long (about 1:2.5–3 in 10–18 s). It is the most reliable way to pull light roasts without the sour-bitter trap.', 6);
          also('prep', 'Distribution still helps', 'A needle tool and a level tamp make every shot more even, but on lighter roasts they can’t rescue a grind that is too fine.', 2);
        } else {
          res.verdict = v('uneven', 'Uneven extraction.', 'Water found easy paths through the puck. Those paths over-extract while the rest barely starts, so you taste sour and bitter together.');
          prepAction('On darker roasts the grind is rarely the cause. Evenness is.');
          if (tState === 'slow') grindAction(stepsFor(tMid - t), 'It also ran slow, so open the grind a little.', null);
          if (y < -0.3) yieldAction(-0.2, 'It also tastes thin: cut the watery tail.', null);
        }
        tempAlso();
        return finish();
      }
      if (flags.has('harsh')) {
        res.gate = 'harsh';
        if (tState === 'fast') {
          res.verdict = v('harsh', 'Harsh and fast: channeling.', 'Water is rushing through cracks in the puck and stripping them of the drying, astringent compounds.');
          prepAction('An even, level puck stops water finding shortcuts.');
          yieldAction(-0.25, 'The harshest compounds come at the end. Stopping earlier leaves them behind.', null);
        } else {
          res.verdict = v('harsh', 'Harsh, drying finish.', 'The tail end of the shot is pulling astringent compounds. Stop earlier and ease the grind.');
          yieldAction(-0.25, 'The harshest compounds come at the end of the shot.', null);
          const dt = tState === 'slow' ? tMid - t : -3.5;
          grindAction(stepsFor(dt), 'A slightly coarser grind shortens contact at the end of the shot.', null);
          if (hasTemp && (P.temp >= 94 || bi.L <= -1)) tempAction(-1, 'Cooler water extracts fewer harsh compounds', true);
          also('pressure', 'Soften the start', (mc.preinf === 'manual' || mc.preinf === 'auto') ? 'Use pre-infusion (a few seconds of low pressure) so the puck soaks before full pressure hits it.' : 'If your machine allows it, a gentler pressure ramp keeps the puck from cracking.', 2);
        }
        return finish();
      }
      if (flags.has('flat')) {
        res.gate = 'flat';
        if (age === 'old' || age === 'stale') {
          res.verdict = v('flat', 'Past its best.', 'The aromatics that make coffee taste alive have faded from these beans. Ćejf can help you get the most from them, but fresh beans are the real fix.');
          if (hasGrinder) grindAction(stepsFor(3), 'A finer grind pulls out what is left.', null);
          yieldAction(-0.2, 'A shorter ratio concentrates the flavour that remains.', null);
        } else if (age === 'fresh') {
          res.verdict = v('flat', 'Too fresh.', 'Very fresh beans are full of CO₂. The gas pushes water around the grounds, so flavour stays locked in.');
          add({ lever: 'rest', title: 'Let the beans rest', detail: 'Wait ' + Math.max(2, 7 - (bi.age || 0)) + '–' + Math.max(5, 12 - (bi.age || 0)) + ' more days', why: 'Most espresso roasts taste best from about 7 to 30 days after roasting.', vec: null, change: null });
          also('pressure', 'Pre-infuse longer', 'A longer low-pressure soak lets CO₂ escape before full pressure.', 3);
        } else {
          res.verdict = v('flat', 'Flat and muted.', 'Not enough of the aromatic compounds made it into the cup.');
          grindAction(stepsFor(4), 'A finer grind extracts more of the flavour.', null);
          if (hasTemp) tempAction(1, 'Hotter water dissolves more aroma', false);
          also('water', 'Check your water', 'Very soft or distilled water tastes flat; very hard water mutes flavour and scales your machine. Filtered tap or a coffee water recipe works best.', 2);
        }
        return finish();
      }
    }

    if (fam === 'pourover' || fam === 'immersion') {
      if (flags.has('uneven') && fam === 'pourover') {
        res.gate = 'uneven';
        res.verdict = v('uneven', 'Uneven extraction.', 'Some water ran through channels in the bed while the rest barely touched the coffee, so sour and bitter show up together.');
        prepAction('Even pours give every ground the same contact.');
        if (tState === 'slow') grindAction(stepsFor(tMid - t), 'It also drained slowly: fines may be clogging the paper.', null);
        also('grinder', 'Check your grind for dust', 'Lots of very fine particles (fines) clog the filter and cause uneven flow. Burr grinders make far fewer than blade grinders.', 2);
        return finish();
      }
      if (flags.has('harsh')) {
        res.gate = 'harsh';
        res.verdict = v('harsh', 'Harsh and drying.', 'Too much agitation, too-fine grounds or water that is too hot pulled out astringent compounds.');
        if (fam === 'immersion' && typeof P.steep === 'number') steepAction(-0.5, 'Shorter contact extracts fewer drying compounds.', null);
        grindAction(fam === 'pourover' ? stepsFor(-20) : -Math.max(1, zspan * 0.08 / (g.step || 1)), 'Coarser grounds release fewer harsh fines.', null);
        if (hasTemp && P.temp >= 94) tempAction(-2, 'Slightly cooler water is gentler', true);
        also('prep', 'Stir and swirl less', 'Vigorous stirring and high pours churn fines into the bed. Pour low and gently.', 3);
        if (fam === 'immersion' && mId === 'frenchpress') also('prep', 'Don’t press hard', 'Press the plunger only to the surface. Forcing it squeezes out bitter, silty liquid.', 3);
        return finish();
      }
      if (flags.has('muddy')) {
        res.gate = 'muddy';
        res.verdict = v('muddy', 'Muddy and silty.', 'Fine particles are ending up in the cup, which dulls the flavour and adds grit.');
        grindAction(-Math.max(1, Math.round(zspan * 0.1 / g.step)), 'Coarser grounds make fewer fines.', null);
        add({ lever: 'prep', title: 'Let it settle, pour slowly', detail: mId === 'frenchpress' ? 'Wait the full time after skimming, plunge only to the surface, and leave the last bit in the pot.' : 'Give the grounds a minute to settle and stop pouring before the dregs.', why: 'Most sediment sinks if you give it time.', vec: null, change: null });
        return finish();
      }
      if (flags.has('flat')) {
        res.gate = 'flat';
        if (age === 'old' || age === 'stale') {
          res.verdict = v('flat', 'Past its best.', 'These beans have lost most of their aromatics. A few tweaks help, but fresh beans are the real fix.');
          grindAction(stepsFor(15), 'A finer grind pulls out what is left.', null);
        } else {
          res.verdict = v('flat', 'Flat or papery.', 'Either the paper is adding its own taste, or too little aroma made it into the cup.');
          if (fam === 'pourover') add({ lever: 'prep', title: 'Rinse the paper filter', detail: 'Pour hot water through the empty paper and discard it before brewing.', why: 'Unrinsed paper tastes like cardboard.', vec: null, change: null });
          grindAction(fam === 'pourover' ? stepsFor(15) : Math.max(1, Math.round(zspan * 0.08 / g.step)), 'A finer grind extracts more aroma.', null);
          if (hasTemp && P.temp < 96) tempAction(2, 'Hotter water extracts more aroma', true);
        }
        return finish();
      }
    }

    if (fam === 'moka') {
      if (flags.has('burnt')) {
        res.gate = 'burnt';
        res.verdict = v('burnt', 'Burnt or metallic.', 'The coffee cooked in the pot: too much heat, or it kept running after the sweet part was done.');
        add({ lever: 'stop', title: 'Take it off the heat sooner', detail: 'Stop when the stream turns pale and starts to sputter, then cool the base under the tap.', why: 'The last part of a moka brew is steam-driven, hot and bitter.', vec: [VEC.moka.stop[0] * 0.6, VEC.moka.stop[1] * 0.6], change: null });
        add({ lever: 'heat', title: 'Use lower heat and a hot-water start', detail: 'Fill the base with just-boiled water and keep the flame at medium-low.', why: 'A slow, gentle rise extracts sweetness instead of scorching.', vec: null, change: null });
        also('prep', 'Clean the pot', 'Old coffee oil in the gasket and filter tastes metallic and rancid. Wash with warm water and replace a hard gasket.', 3);
        return finish();
      }
      if (flags.has('harsh')) {
        res.gate = 'harsh';
        res.verdict = v('harsh', 'Harsh and drying.', 'Too much heat or too fine a grind.');
        add({ lever: 'stop', title: 'Take it off the heat sooner', detail: 'Stop at the first sputter.', why: 'The end of a moka brew is the harshest part.', vec: [VEC.moka.stop[0] * 0.5, VEC.moka.stop[1] * 0.5], change: null });
        grindAction(-Math.max(1, Math.round(zspan * 0.12 / g.step)), 'Slightly coarser grounds extract gentler.', null);
        return finish();
      }
      if (flags.has('flat')) {
        res.gate = 'flat';
        res.verdict = v('flat', 'Flat and dull.', age === 'old' || age === 'stale' ? 'The beans are past their best.' : 'Too little flavour made it through.');
        grindAction(Math.max(1, Math.round(zspan * 0.12 / g.step)), 'A finer grind extracts more.', null);
        add({ lever: 'prep', title: 'Fill the basket to the top', detail: 'Level it off with a finger. Do not tamp.', why: 'A half-full basket lets water rush through.', vec: null, change: null });
        return finish();
      }
    }

    if (fam === 'turkish') {
      if (flags.has('burnt')) {
        res.gate = 'burnt';
        res.verdict = v('burnt', 'Burnt taste.', 'It boiled too hard or too long. Turkish coffee should rise, never boil.');
        add({ lever: 'heat', title: 'Lower the heat, rise just once', detail: 'Lift the pot the moment the foam climbs to the rim.', why: 'A hard boil scorches the coffee and destroys the foam.', vec: [-0.5, 0], change: null });
        also('heat', 'Start from cold water', 'Cold water and a slow rise give sweetness time to develop.', 2);
        return finish();
      }
      if (flags.has('nofoam')) {
        res.gate = 'nofoam';
        res.verdict = v('nofoam', 'No foam.', 'Foam (kajmak) forms during a slow rise from cold water, and it collapses if the coffee boils or you stir too late.');
        add({ lever: 'heat', title: 'Start cold, heat slowly', detail: 'Stir once while the water is still cold, then don’t stir again.', why: 'A slow rise builds a stable, dark foam.', vec: null, change: null });
        add({ lever: 'prep', title: 'Spoon the first foam into the cup', detail: 'As the foam first rises, spoon some into each cup before returning the pot to the heat.', why: 'It keeps the best foam from boiling away.', vec: null, change: null });
        if (age === 'old' || age === 'stale') also('bean', 'Use fresher coffee', 'Stale coffee makes thin foam. Fresh grounds rise noticeably better.', 4);
        return finish();
      }
      if (flags.has('gritty')) {
        res.gate = 'gritty';
        res.verdict = v('gritty', 'Gritty.', 'Some sediment is normal. Too much means it was poured too fast or sipped too soon, or the grind isn’t fine enough.');
        add({ lever: 'prep', title: 'Rest before sipping', detail: 'Pour slowly, then let the cup sit 30–60 seconds.', why: 'The grounds settle to the bottom.', vec: null, change: null });
        also('grinder', 'Grind finer, not coarser', 'Turkish grind must be powder, like flour. Slightly coarser grounds stay suspended and feel gritty.', 4);
        return finish();
      }
    }

    /* ═══ 3. Compass: decompose into this family's two levers ═══ */
    const ex = -x, st = -y;
    const V = VECS();

    if (fam === 'espresso') {
      let [a, b] = solve(V.grind, V.yield, ex, st);          // a>0 finer, b>0 more yield
      if (!hasGrinder) {
        /* No grind lever: use yield for extraction/strength and dose as the second lever. */
        /* No grind lever: yield moves the cup diagonally, temperature moves it sideways. */
        const T = [1, 0.1];
        const [by, bt] = solve(V.yield, T, ex, st);
        res.verdict = baseVerdict();
        if (Math.abs(by) >= 0.12) yieldAction(clamp(by * 0.5, -0.6, 0.6), by > 0 ? 'More water through the puck extracts more and dilutes the cup.' : 'Stopping earlier keeps it stronger and cuts the bitter tail.', by);
        if (Math.abs(bt) >= 0.15) {
          const deg = clamp(Math.round(bt * 3), -3, 3) || Math.sign(bt);
          tempAction(deg, bt > 0 ? 'With pre-ground coffee, temperature is your extraction lever: hotter extracts more' : 'With pre-ground coffee, temperature is your extraction lever: cooler extracts less', !hasTemp);
        }
        also('grinder', ex > 0 ? 'Ask for a finer espresso grind' : 'Ask for a coarser espresso grind', 'With pre-ground coffee the grind is fixed. Next bag, ask the roaster to grind ' + (ex > 0 ? 'a touch finer' : 'a touch coarser') + ' for your machine.', 4);
        return finish();
      }

      /* grind-limit: already moved this way last time and it didn't help */
      const limit = grindLimit(a > 0 ? 'finer' : 'coarser');
      if (limit) {
        res.notes.push('You already moved the grind ' + (a > 0 ? 'finer' : 'coarser') + ' last time and it still tastes ' + (x < 0 ? 'sour' : 'bitter') + '. The grind may be near its limit on this coffee, so work the other levers.');
      }

      if (a > 0.1 && tState === 'slow' && !veryFast) {
        /* Sour but slow: finer would choke it. */
        res.gate = 'sour-slow';
        if (bi.L >= 1) {
          res.verdict = v('sour', 'Sour, even though it ran slow.', 'On a lighter roast this usually means the grind is already too fine: the puck chokes and water only finds a few paths. Go coarser and longer.');
          grindAction(stepsFor(tMid - t), 'Coarser grounds let water through the whole puck.', null);
          yieldAction(0.5, 'A longer ratio keeps extraction up while the grind opens.', null);
          if (rid !== 'turbo') also('recipe', 'Try the Turbo style', 'Coarse, fast and long. The easiest way to pull light roasts sweet.', 5);
        } else {
          res.verdict = v('sour', 'Sour, even though it ran slow.', 'A finer grind would only choke it. The extra extraction has to come from somewhere else.');
          yieldAction(clamp(Math.max(b, 0.5 * a) * 0.5 + 0.1, 0.2, 0.6), 'Letting more water through extracts more without a finer grind.', null);
          if (hasTemp) tempAction(bi.L >= 0 ? 2 : 1, 'Hotter water extracts more', false);
          else tempAction(1, '', true);
          also('prep', 'Check for channeling', 'A slow, sour shot can also mean water is running through a few channels. A needle tool and a level tamp help.', 3);
        }
        return finish();
      }
      if (a < -0.1 && tState === 'fast') {
        res.gate = 'bitter-fast';
        if (veryFast) {
          res.verdict = v('bitter', 'Bitter and gushing.', 'With almost no resistance, water blasts through channels and over-extracts them. More resistance is the fix.');
          grindAction(stepsFor(tMid - t), 'A finer grind rebuilds resistance so the whole puck extracts evenly.', null);
          prepAction('Clumps and an uneven bed make channels.');
        } else {
          res.verdict = v('bitter', 'Bitter, even though it ran fast.', 'Coarser would make it worse. Water is racing through channels and over-extracting them.');
          prepAction('An even, level puck is the fix for fast and bitter.');
          yieldAction(clamp(Math.min(b, -0.3) * 0.5, -0.4, -0.15), 'Stopping earlier cuts the bitter tail.', null);
          if (hasTemp && bi.L <= -1) tempAction(-2, 'Darker roasts turn bitter in hot water', false);
        }
        return finish();
      }

      /* Normal case: grind and yield, sized by time when the time agrees. */
      res.verdict = baseVerdict();
      let aUse = a, bUse = b;
      if (limit) { bUse = b + a * 0.5; aUse = 0; }
      const actions = [];
      if (Math.abs(aUse) >= 0.1) {
        let dt;
        const confirms = (aUse > 0 && tState === 'fast') || (aUse < 0 && tState === 'slow');
        if (confirms) dt = (tMid - t) * (sens && sens.basis === 'learned' ? 1 : 0.75);
        else dt = aUse * 7;
        if (confirms) science('Taste and time agree, so the grind change aims for the middle of the window (' + Math.round(tMid) + ' s).');
        /* keep the next shot inside the window when the time is known */
        if (W && t !== null && !confirms) {
          const maxUp = W[1] + 2 - t, maxDown = W[0] - 2 - t;
          dt = clamp(dt, Math.min(0, maxDown), Math.max(0, maxUp));
        }
        actions.push({ k: 'grind', mag: Math.abs(aUse), dt, coef: aUse });
      }
      if (Math.abs(bUse) >= 0.18 || (Math.abs(bUse) >= 0.1 && Math.abs(aUse) < 0.1)) actions.push({ k: 'yield', mag: Math.abs(bUse), coef: bUse });
      actions.sort((p, q) => q.mag - p.mag);
      let grindDone = false;
      for (const a2 of actions) {
        if (a2.k === 'grind') {
          const steps = stepsFor(a2.dt);
          if (Math.abs(steps) >= 0.5) grindDone = grindAction(steps, a2.coef > 0 ? 'Finer grounds slow the water down so it can dissolve more of the sweetness.' : 'Coarser grounds let water through sooner, before the bitter compounds.', a2.coef);
          if (!grindDone) {
            /* grind can't move without leaving the window: use yield/temp instead */
            res.notes.push('The ' + shot + ' is already at the edge of the time window, so Ćejf avoids moving the grind.');
            if (!actions.some(q => q.k === 'yield')) yieldAction(clamp(a2.coef * 0.5, -0.4, 0.4), a2.coef > 0 ? 'A longer ratio extracts more.' : 'A shorter ratio cuts the bitter tail.', a2.coef * 0.8);
            if (hasTemp) tempAction(a2.coef > 0 ? 1 : -1, a2.coef > 0 ? 'Hotter water extracts more' : 'Cooler water extracts less', false);
          }
        } else {
          yieldAction(clamp(a2.coef * 0.5, -0.6, 0.6), a2.coef > 0 ? (y > 0.2 ? 'More water opens up an intense shot and extracts a little more.' : 'A longer pull extracts more of the coffee.') : (x > 0.2 ? 'Stopping earlier leaves the bitter tail behind and makes it stronger.' : 'Less water in the cup makes it stronger.'), a2.coef);
        }
      }
      tempAlso();
      return finish();
    }

    if (fam === 'pourover') {
      let [a, b] = solve(V.grind, V.dose, ex, st);           // a>0 finer, b>0 more coffee
      res.verdict = baseVerdict();
      const drawdown = M.time === 'drawdown';
      if (a > 0.1 && drawdown && tState === 'slow') {
        res.gate = 'sour-slow';
        res.verdict = v('sour', 'Sour, even though it drained slowly.', 'A finer grind would clog the bed further. Slow and sour usually means fines are blocking the paper and water is channeling.');
        prepAction('Gentle, even pours keep fines from migrating to the paper.');
        if (hasTemp) tempAction(2, 'Hotter water extracts more without slowing the drawdown', false);
        if (t > W[1] + 45) grindAction(-1, 'It drained far too slowly; open the grind a step.', null);
        return finish();
      }
      if (a < -0.1 && drawdown && tState === 'fast') {
        res.gate = 'bitter-fast';
        res.verdict = v('bitter', 'Bitter, even though it drained fast.', 'Coarser would only make it thinner. Fast and bitter points to over-agitation or water that is too hot.');
        if (hasTemp) tempAction(-2, 'Cooler water is gentler on the bitter compounds', false);
        prepAction('Pour lower and slower, and skip the extra stirring.');
        return finish();
      }
      const acts = [];
      if (Math.abs(a) >= 0.1) {
        const confirms = drawdown && ((a > 0 && tState === 'fast') || (a < 0 && tState === 'slow'));
        const dt = confirms ? tMid - t : a * 25;
        acts.push({ k: 'grind', mag: Math.abs(a), dt, coef: a });
      }
      if (Math.abs(b) >= 0.18) acts.push({ k: 'dose', mag: Math.abs(b), coef: b });
      acts.sort((p, q) => q.mag - p.mag);
      for (const a2 of acts) {
        if (a2.k === 'grind') {
          if (!hasGrinder) {
            if (hasTemp) tempAction(a2.coef > 0 ? 2 : -2, a2.coef > 0 ? 'Without a grinder, hotter water is your best way to extract more' : 'Cooler water extracts less', false);
            also('grinder', a2.coef > 0 ? 'Next bag: a finer grind' : 'Next bag: a coarser grind', 'With pre-ground coffee the grind is fixed. Ask for ' + (a2.coef > 0 ? 'a finer' : 'a coarser') + ' grind for your ' + M.name + '.', 4);
          } else grindAction(stepsFor(a2.dt), a2.coef > 0 ? 'Finer grounds slow the drawdown and extract more.' : 'Coarser grounds drain sooner and extract less.', a2.coef);
        } else doseAction(clamp(a2.coef * 0.1, -0.15, 0.15), a2.coef > 0 ? 'More coffee for the same water makes a stronger cup.' : 'Less coffee for the same water makes a lighter cup.', a2.coef);
      }
      if (hasGrinder && Math.abs(a) >= 0.4 && hasTemp) tempAction(a > 0 ? 1 : -1, a > 0 ? 'A degree or two hotter also helps' : 'A degree or two cooler also helps', true);
      return finish();
    }

    if (fam === 'immersion') {
      let [a, b] = solve(V.steep, V.dose, ex, st);           // a>0 longer steep / finer
      res.verdict = baseVerdict();
      const acts = [];
      if (Math.abs(a) >= 0.1) acts.push({ k: 'steep', mag: Math.abs(a), coef: a });
      if (Math.abs(b) >= 0.18) acts.push({ k: 'dose', mag: Math.abs(b), coef: b });
      acts.sort((p, q) => q.mag - p.mag);
      for (const a2 of acts) {
        if (a2.k === 'steep') {
          const done = typeof P.steep === 'number' && steepAction(a2.coef, a2.coef > 0 ? 'More time in the water extracts more.' : 'Less time in the water extracts less.', a2.coef);
          if (!done || Math.abs(a2.coef) >= 0.5) {
            if (hasGrinder) grindAction(a2.coef > 0 ? Math.max(1, Math.round(zspan * 0.1 * Math.abs(a2.coef) / g.step)) : -Math.max(1, Math.round(zspan * 0.1 * Math.abs(a2.coef) / g.step)), a2.coef > 0 ? 'Finer grounds extract faster.' : 'Coarser grounds extract slower.', done ? null : a2.coef);
          }
        } else doseAction(clamp(a2.coef * 0.1, -0.15, 0.15), a2.coef > 0 ? 'More coffee for the same water makes a stronger cup.' : 'Less coffee makes a lighter cup.', a2.coef);
      }
      return finish();
    }

    if (fam === 'moka') {
      res.verdict = baseVerdict();
      if (ex > 0.1) {
        if (hasGrinder) grindAction(Math.max(1, Math.round(zspan * 0.15 * ex / g.step)), 'Finer grounds extract more (never espresso-fine, or the pot struggles).', ex);
        add({ lever: 'prep', title: 'Fill the basket to the top', detail: 'Level it off; do not tamp.', why: 'A full, even basket makes water work through all of the coffee.', vec: null, change: null });

      if (ex < -0.1) {

function timerWindow(m, f, Rc, p) {

}

    s.push({ text: 'Bring ' + Math.round(p.out) + ' g of water to the boil in the pot' + (sugar ? ' with ' + sugar + ' tsp sugar' : '') });
    s.push({ text: 'Pour a little aside, stir ' + fmtG(p.dose) + ' g of powder-fine coffee into the rest' });
    s.push({ text: 'Return to low heat and let the foam rise once or twice' });
    s.push({ text: 'Top up with the water you set aside, then pour slowly' });

    s.push({ text: 'Stir ' + fmtG(p.dose) + ' g powder-fine coffee' + (sugar ? ' and ' + sugar + ' tsp sugar' : '') + ' into ' + Math.round(p.out) + ' g cold water, once' });
    s.push({ text: 'Heat slowly on low. Don’t stir again' });

function timerBlock(m, M, f, Rc, p, se) {
  const W = timerWindow(m, f, Rc, p);

  let h = '<div class="timer" id="timer">';

    const max = f === 'espresso' ? Math.max(45, W[1] + 10) : (W ? W[1] + 60 : 300);
    const C = 2 * Math.PI * 88;
    const arc = (a, b) => 'stroke-dasharray="' + Math.max(0, (b - a) / max * C).toFixed(1) + ' ' + C.toFixed(1) + '" stroke-dashoffset="' + (-(a / max) * C).toFixed(1) + '"';
    const t = se.running ? (Date.now() - se.t0) / 1000 : (se.time || 0);
    const cls = se.running ? 'running' : (se.time ? 'stopped' : 'idle');
    const inW = W && t >= W[0] && t <= W[1], over = W && t > W[1];
    h += '<button class="dial ' + cls + (t > 0 && inW ? ' in' : '') + (t > 0 && over ? ' over' : '') + '" data-act="timer" id="dial" aria-label="' + (se.running ? 'Stop timer' : se.time ? 'Edit time' : 'Start timer') + '" data-max="' + max + '">' +
      '<svg class="ring" viewBox="0 0 200 200"><circle class="track" cx="100" cy="100" r="88" fill="none" stroke-width="9"/>' +
      (W ? '<circle class="win" cx="100" cy="100" r="88" fill="none" stroke-width="9" ' + arc(W[0], W[1]) + '/>' : '') +
      '<circle class="prog" id="ring-prog" cx="100" cy="100" r="88" fill="none" stroke-width="9" ' + arc(0, Math.min(t, max)) + '/></svg>' +
      '<div class="face"><div class="t" id="t-val">' + timeText(t, f, se.running) + '</div><div class="hint" id="t-hint">' + (se.running ? 'Tap to stop' : se.time ? 'Tap to edit' : 'Start') + '</div></div></button>';
    if (f !== 'espresso') {
      const steps = stepsFor(m, Rc, p);
      if (steps.length) {
        h += '<div class="step-now" id="step-now">' + stepNow(steps, t, se.running) + '</div>';
        h += '<ol class="steps" id="steps">' + steps.map((s, i) => '<li data-i="' + i + '"' + stepCls(steps, i, t, se) + '><span class="at">' + mmss(s.t) + '</span><span>' + esc(s.text) + '</span></li>').join('') + '</ol>';
      }
    }
    h += '<div class="t-state" id="t-state">' + stateLine(t, W, f, se) + '</div>';
    if (se.running) h += '';
    else if (se.time) h += '<div class="timer-actions"><button class="btn quiet" data-act="timer-reset">' + I.reset + 'Reset</button><button class="btn" data-act="taste">How did it taste?</button></div>';
    else h += '<button class="link" data-act="taste">Skip the timer and taste it</button>';
  } else {
    const steps = f === 'turkish' ? turkishSteps(p, Rc) : (Rc.steps || []);
    if (steps.length) {
      h += '<ol class="steps">' + steps.map((s, i) => '<li class="check' + ((se.checks || []).includes(i) ? ' done' : '') + '" data-act="check" data-i="' + i + '"><span class="box">' + ((se.checks || []).includes(i) ? I.check : '') + '</span><span>' + esc(s.text) + '</span></li>').join('') + '</ol>';
    } else h += '<p class="muted" style="margin:0;text-align:center">Brew as usual, then tell Ćejf how it tasted.</p>';

function timeText(t, f, running) {

}

function stepCls(steps, i, t, se) {

function stateLine(t, W, f, se) {
  if (se.running) return f === 'espresso' ? 'Stop the shot at ' + fmtG(getWork().params.out) + ' g' : '';
  if (!se.time) return f === 'espresso' ? '<span class="muted">Tap when the pump starts</span>' : '';
  if (!W) return '';
  const label = f === 'espresso' ? 'Shot' : 'Brew';

  if (se.time < W[0]) return label + ' ' + tt + ' <span class="pill warn">fast</span>';
  if (se.time > W[1]) return label + ' ' + tt + ' <span class="pill warn">slow</span>';

/* timer loop */
let rafId = null, wakeLock = null;
function mountBrew() { if (sess().running) loop(); }
function loop() {
  cancelAnimationFrame(rafId);
  const tick = () => {
    const se = sess(); if (!se.running) return;
    const t = (Date.now() - se.t0) / 1000;
    const dial = $('#dial'); if (!dial) return;
    const m = methodId(), f = fam(), Rc = Engine.recipe(m, recipeIdFor(m)), p = getWork().params;
    const W = timerWindow(m, f, Rc, p), max = Number(dial.dataset.max), C = 2 * Math.PI * 88;
    $('#t-val').innerHTML = timeText(t, f, true);
    const prog = $('#ring-prog'); prog.setAttribute('stroke-dasharray', (Math.min(t, max) / max * C).toFixed(1) + ' ' + C.toFixed(1));
    dial.classList.toggle('in', !!W && t >= W[0] && t <= W[1]); dial.classList.toggle('over', !!W && t > W[1]);
    if (f !== 'espresso') {
      const steps = stepsFor(m, Rc, p), sn = $('#step-now');
      if (sn && steps.length) {

        let cur = 0; for (let i = 0; i < steps.length; i++) if (t >= steps[i].t) cur = i;
        $$('#steps li').forEach((li, i) => { li.classList.toggle('now', i === cur); li.classList.toggle('done', i < cur); });
      }

}

  } catch (e) { wakeLock = null; }
}

  let se = sess();

    se.running = false; se.time = Math.max(1, Math.round((Date.now() - se.t0) / 1000));
    cancelAnimationFrame(rafId); lockWake(false); save(); render();
    if (navigator.vibrate) try { navigator.vibrate(30); } catch (e) { /* ignore */ }

  }

  const w = getWork(); if (w.changed && Object.keys(w.changed).length) w.changed = {};

/* app/40-taste.js */
/* ── Ćejf app · taste → diagnosis → fix ─────────────────────────────────────
   One sheet, two states. "input": the compass, flags and a button. "result": the
   same compass, now showing the fix as arrows, and the verdict with the steps. */

let TS = null;                                   // taste sheet state while it is open
function sheetEl() { return sheetState ? sheetState.el : null; }
function setFoot(html) { const el = sheetEl(); if (!el) return; const ft = $('.sheet-ft', el); ft.innerHTML = html || ''; ft.hidden = !html; }
function setTitle(t) { const el = sheetEl(); if (el) $('.sheet-title', el).textContent = t; }

/* Simple mode keeps the fix to its two strongest steps; Detailed shows them all. */
function shownActions(res) {
  const acts = (res && res.actions) || [];
  return detailed() ? acts : acts.slice(0, 2);
}
/* Short labels drawn along the compass path, one per lever that moves the cup. */
function tagFor(a) {
  switch (a.lever) {
    case 'grind': return a.dir;
    case 'yield': return a.dir === 'more' ? 'longer' : 'shorter';
    case 'dose': return a.dir === 'more' ? 'more coffee' : 'less coffee';
    case 'temp': return a.dir;
    case 'steep': return a.dir;
    case 'stop': return 'stop sooner';
    case 'heat': return a.vec && a.vec[0] > 0 ? 'rise twice' : 'rise once';
    case 'prep': return fam() === 'espresso' ? 'even puck' : 'even pour';
    case 'rest': return 'rest';

  }
}
function displayPath(res) {
  const t = res.taste, acts = shownActions(res);
  let path = [[t.x, t.y]], tags = [];
  let px = t.x, py = t.y;
  for (const a of acts) {
    if (!a.vec) continue;
    px = clamp(px + a.vec[0], -1, 1); py = clamp(py + a.vec[1], -1, 1);
    path.push([Math.round(px * 1000) / 1000, Math.round(py * 1000) / 1000]); tags.push(tagFor(a));
  }
  /* flags-driven fixes have no vector: point straight at the sweet spot */
  if (path.length < 2 && !res.dialed && t.d >= 0.2 && acts.length && acts[0].lever !== 'none') {
    path = [[t.x, t.y], [t.x * 0.12, t.y * 0.12]]; tags = [tagFor(acts[0])];
  }
  return { path, tags };
}

/* ── one-line summary of a recipe or brew ─────────────────────────────────── */
function grindLabel(v, m, grinderId) {
  if (typeof v !== 'number') return '';
  const g = Engine.grinder(grinderId || S.gear.grinder);
  if (g.preground || !Engine.canGrind(g, METHODS[m].zone, grinderId && grinderId !== S.gear.grinder ? {} : S.gear.zoneOverrides)) return GRIND_LABELS[clamp(Math.round(v), 0, 6)];
  return Engine.fmtGrind(g, v);
}
function paramSummary(p, m, grinderId, opts) {
  opts = opts || {};
  const f = Engine.family(m), out = [];
  if (!p) return '';
  if (typeof p.dose === 'number' && typeof p.out === 'number') out.push(f === 'espresso' ? fmtG(p.dose) + ' → ' + fmtG(p.out) + ' g' : fmtG(p.dose) + ' g · ' + Math.round(p.out) + ' ml');
  if (typeof p.time === 'number' && !opts.noTime) out.push(f === 'espresso' ? p.time + ' s' : mmss(p.time));
  const gl = grindLabel(p.grind, m, grinderId); if (gl) out.push(gl);
  if (typeof p.steep === 'number' && f === 'immersion') out.push('steep ' + mmss(p.steep));
  if (typeof p.temp === 'number' && !opts.noTemp) out.push(tC(p.temp));
  if (typeof p.sugar === 'number' && p.sugar > 0) out.push(fmtG(p.sugar) + ' tsp sugar');
  if (typeof p.tds === 'number') out.push('TDS ' + p.tds + '%');

}

/* ── the taste sheet ──────────────────────────────────────────────────────── */
function openTaste() {

  const ts = { mode: se.result ? 'result' : 'input' };
  TS = ts;
  const rid = recipeIdFor(methodId());
  const trail = historyFor(methodId(), rid, se.brewId).slice(0, 3).map(h => [h.taste.x || 0, h.taste.y || 0]);
  openSheet({
    title: 'How did it taste?', cls: 'taste', label: 'Taste',
    body: '<div class="cmp-holder">' + Compass.markup(f, S.settings.drink) + '</div><div id="taste-below"></div>',
    mount: el => {
      Compass.mount(el, {
        x: t ? t.x : 0, y: t ? t.y : 0, set: !!(t && t.set), flags: t ? (t.flags || []) : [],
        family: f, trail, onChange: onTasteChange,
      });
      if (TS.mode === 'result') showResultView(false); else showInputView();
    },
    onClose: () => { if (TS === ts) TS = null; },
  });
}

}

  if (detailed() && f === 'espresso') parts.push(v(fmtG(typeof se.out === 'number' ? se.out : getWork().params.out), 'g') + ' out');

}
function howToTaste(f) {

/* ── diagnosis & saving ───────────────────────────────────────────────────── */
/* Diagnose the session's taste (set from the compass by the taste sheet) and save the brew. */
function runDiagnosis() {
  const m = methodId(), rid = recipeIdFor(m), w = getWork(), se = sess(), c = coffee();
  const t = se.taste || { x: 0, y: 0, flags: [], set: false };
  const params = Object.assign({}, w.params);
  delete params.ratio;
  params.time = se.time || null;
  if (fam() === 'espresso' && typeof se.out === 'number') params.out = se.out;
  if (typeof se.tds === 'number') params.tds = se.tds;
  const res = Engine.diagnose({
    method: m, recipeId: rid, params, bean: beanCtx(c), gear: gearCtx(), drink: fam() === 'espresso' ? S.settings.drink : 'straight',
    taste: { x: t.set ? t.x : 0, y: t.set ? t.y : 0, flags: t.flags }, history: historyFor(m, rid, se.brewId), now: Date.now(),
  });
  se.result = res; se.applied = false;
  saveBrew(res, params);
  return res;
}
function cleanParams(p) {
  const o = {};
  for (const k of ['dose', 'out', 'time', 'grind', 'temp', 'steep', 'sugar', 'tds']) if (typeof p[k] === 'number' && Number.isFinite(p[k])) o[k] = p[k];
  return o;
}
function saveBrew(res, params) {
  const se = sess(), m = methodId(), rid = recipeIdFor(m), c = coffee();
  let b = se.brewId ? S.brews.find(x => x.id === se.brewId) : null;
  if (!b) { b = { id: uid(), ts: Date.now(), notes: '' }; S.brews.unshift(b); se.brewId = b.id; }
  Object.assign(b, {
    coffeeId: c ? c.id : null, method: m, recipeId: rid, grinder: S.gear.grinder,
    drink: fam() === 'espresso' ? S.settings.drink : null,
    params: cleanParams(params), taste: { x: res.taste.x, y: res.taste.y, flags: res.taste.flags.slice() },
    words: res.taste.words, verdict: { tone: res.verdict ? res.verdict.tone : 'dialed', title: res.verdict ? res.verdict.title : '' },
    fixes: shownActions(res).filter(a => a.lever !== 'none').map(a => a.title), dialed: !!res.dialed,
  });
  if (c) {
    c.best = c.best || {};
    const cur = c.best[m];
    if (res.dialed) {
      const bp = cleanParams(params); delete bp.time; delete bp.tds;
      c.best[m] = { recipeId: rid, params: bp, ts: b.ts, brewId: b.id, grinder: S.gear.grinder, prev: cur && cur.brewId !== b.id ? Object.assign({}, cur, { prev: undefined }) : (cur && cur.prev) || undefined };
    } else if (cur && cur.brewId === b.id) {
      if (cur.prev) c.best[m] = cur.prev; else delete c.best[m];
    }
  }
  save();
}

/* ── applying the fix ─────────────────────────────────────────────────────── */
function applyFix() {
  const se = sess(), res = se.result; if (!res) { closeSheet(); return; }
  const w = getWork(), changed = {};
  const acts = shownActions(res);
  for (const a of acts) {
    if (!a.change) continue;
    for (const k of Object.keys(a.change)) {
      if (!(k in changed)) changed[k] = w.params[k];
      w.params[k] = a.change[k];
    }
  }
  for (const k of Object.keys(changed)) if (changed[k] === w.params[k]) delete changed[k];
  if (fam() === 'espresso' && w.params.dose) w.params.ratio = Math.round(w.params.out / w.params.dose * 100) / 100;
  w.changed = changed; w.shot = (w.shot || 1) + 1; w.reasons = []; w.auto = false;
  const first = acts.find(a => a.lever !== 'none');
  newSession(); save();
  closeSheet(); render();
  toast(first ? localizeTemps(first.title) : 'Same again, then taste');
}

/* ── naming the coffee after a dialed-in brew ─────────────────────────────── */
/* The brew was made with no coffee selected. Create the coffee, move this session's
   work and brew onto it, and keep the recipe. Called by the coffee form on save. */
function adoptInto(c) {
  const se = sess(), m = methodId(), rid = recipeIdFor(m);
  const oldKey = workKey(m, rid, null), newKey = workKey(m, rid, c.id);
  if (S.work[oldKey]) { S.work[newKey] = S.work[oldKey]; delete S.work[oldKey]; }
  const b = se.brewId && S.brews.find(x => x.id === se.brewId);
  S.cur.coffeeId = c.id;
  if (b) {
    b.coffeeId = c.id;
    if (b.dialed) { const bp = Object.assign({}, b.params); delete bp.time; delete bp.tds; c.best = c.best || {}; c.best[m] = { recipeId: rid, params: bp, ts: b.ts, brewId: b.id, grinder: S.gear.grinder }; }
  }
  se.key = newKey;
  save();
}

function nudge(k, d) {
  const w = getWork(), p = w.params, g = grinderObj(), f = fam(), M = METHODS[methodId()];
  if (k === 'dose') p.dose = clamp(Math.round((p.dose + d * 0.5) * 10) / 10, 1, 80);
  else if (k === 'out') p.out = clamp(Math.round(p.out + d * (f === 'espresso' ? 1 : 5)), 5, 2000);
  else if (k === 'grind') {
    const step = g.step || 1;
    p.grind = Math.round(clamp(Math.round((p.grind + d * step) / step) * step, 0, g.max) * 1000) / 1000;
  } else if (k === 'temp') p.temp = clamp(p.temp + d, 80, 100);
  else if (k === 'steep') { const r = M.steepRange || [30, 900]; p.steep = clamp(p.steep + d * 15, r[0], r[1]); }
  else if (k === 'sugar') p.sugar = clamp((p.sugar || 0) + d * 0.5, 0, 6);

<h2>Sour or bitter is about extraction</h2>
<p>Brewing dissolves coffee into water, and it happens in an order. Bright acids come out first. Sugars and rounder flavours follow. Bitter, drying compounds come last.</p>

<h2>Weak or strong is about the ratio</h2>
<p>Strength is how much coffee is in the cup compared with water. It is separate from extraction. A cup can be sour and strong, or bitter and weak. The ratio of coffee to water sets most of it.</p>

<li><b style="color:var(--weak)">Weak</b> is watery. The flavour is there, then gone.</li>

    body: () => `
<h2>What dissolves, and when</h2>
<p>Fruit acids and bright aromatics dissolve quickly. Sugars and caramelised flavours follow. Heavier bitter compounds and drying tannins come last and slowest. That is why under-extracted coffee tastes sour and over-extracted coffee tastes bitter and dry.</p>
<figure class="fig">${FIG.extraction()}<figcaption>The balance of what is in the cup shifts as extraction goes on.</figcaption></figure>
<h2>Two numbers</h2>
<p><b>TDS</b>, or total dissolved solids, is the share of the drink that is coffee. Espresso is usually 8 to 12%, filter about 1.2 to 1.5%. A refractometer measures it.</p>
<p><b>Extraction yield</b> is the share of the dry coffee that ended up in the drink. Most good coffee lands between 18 and 22%.</p>
<h2>The formula</h2>
<p>Extraction yield = TDS × drink weight ÷ dry coffee.</p>
<p>An espresso with a TDS of 9.5%, 38 g in the cup and 18 g of coffee: 9.5 × 38 ÷ 18 ≈ 20%. For filter, use the weight of the brewed coffee. If you only know the water, subtract about twice the coffee weight, because the grounds hold on to that much.</p>
<h2>Why taste still wins</h2>
<p>These numbers are averages. A shot can average 20% while some grounds gave far more and others far less. That cup tastes sour and bitter at once. Evenness matters as much as the average.</p>
<div class="tip"><b>In Detailed mode</b> you can add a TDS reading after a shot. Ćejf works out the extraction yield and points out when it disagrees with what you tasted.</div>`,

    body: () => `
<h2>The trap</h2>
<p>A light roast tastes sour, so you grind finer. The shot slows down and still tastes sour, now with bitterness too. You go finer again. The puck packs almost solid, water forces its way through a few narrow paths, and those paths over-extract while the rest of the coffee barely gets wet.</p>

<h2>The way out</h2>

<li><b>Pull a longer ratio.</b> 1:2.5 to 1:3 is normal for light roasts.</li>
<li><b>Use hotter water</b>, around 94 to 96 °C.</li>
<li><b>Accept a faster shot</b> and judge it by taste.</li>

<h2>Turbo shots</h2>
<p>A turbo shot uses a coarse grind, fast flow and a long ratio: about 1:2.5 to 1:3 in 10 to 18 seconds, often at lower pressure if your machine allows it. The cup is clear, juicy and sweet. Pick <b>Turbo</b> as your espresso style to try it.</p>
<h2>Nine bar is a convention</h2>
<p>Espresso machines settled on about 9 bar of pressure, but there is nothing magic about it. Lower pressure often extracts light roasts more evenly.</p>

<p>The look of the stream. Blonding and a spraying bottomless portafilter look alarming, but on light roasts they are unreliable signs. Shot time also depends on your machine’s pump and pre-infusion. Taste tells the truth.</p>

<h2>Channeling</h2>
<p>When water finds a weak spot, such as a crack, a clump or a low side, it rushes through. The grounds along that path over-extract and the rest under-extract. The cup tastes sour and bitter together, often with a harsh finish, and the shot usually runs fast.</p>
<figure class="fig">${FIG.puck()}<figcaption>A channel carries most of the water through a small part of the coffee.</figcaption></figure>
<h2>A reliable routine</h2>
<ol>
<li>Match the dose to the basket, within about 1 g.</li>
<li>Break up clumps. Stir with a thin needle tool in small circles through the whole depth of the coffee.</li>
<li>Level the surface.</li>
<li>Tamp straight down until it is firm and level.</li>
<li>Optional: a paper disc under the coffee or a puck screen on top can even out the flow.</li>
</ol>
<h2>Signs of channeling</h2>
<p>Jets or spurts from a bottomless portafilter, dry patches on the used puck, and a fast shot that tastes harsh. With light roasts some spraying is common and not always a problem.</p>
<h2>Dose and headspace</h2>
<p>Too little coffee leaves a thin puck that water breaks through easily. Too much presses against the shower screen and cracks. Both make channels.</p>`,
  },
  {
    id: 'pressure', group: 'deep', icon: 'temp', mins: 4, title: 'Pressure, flow and pre-infusion',
    sub: 'How the way pressure builds changes the cup.',
    lede: 'Pressure pushes water through the puck. How it rises and falls changes the taste.',
    body: () => `
<figure class="fig">${FIG.pressure()}<figcaption>Four common ways to build pressure during a shot.</figcaption></figure>
<h2>Pre-infusion</h2>
<p>A few seconds at low pressure soak the puck before full pressure arrives. The coffee swells evenly, which reduces channeling. Many machines do this on their own and some let you set the time.</p>
<h2>Blooming shots</h2>
<p>Wet the puck at low pressure, pause for 20 to 30 seconds, then ramp up to full pressure. Shots come out round and sweet, and the method is kind to light roasts. The total time is longer, often 40 to 60 seconds.</p>
<h2>Lower pressure</h2>
<p>Six to eight bar can extract more evenly than nine, especially with coarser grinds. Turbo shots use this.</p>
<h2>Flow</h2>
<p>Once a shot starts dripping it typically flows at 1 to 2 g per second. Machines differ in how fast they deliver water, so the same grind can give different times on two machines. That is why Ćejf learns from your own brews instead of assuming.</p>
<div class="tip"><b>No pressure controls?</b> Grind and ratio still do most of the work. Profiles are a refinement, not a requirement.</div>`,
  },
  {
    id: 'water', group: 'deep', icon: 'drop', mins: 4, title: 'Temperature and water',
    sub: 'Hotter extracts more. Minerals decide what gets extracted.',
    lede: 'Hotter water extracts more. The minerals in your water decide what it extracts.',
    body: () => `
<h2>Temperature by roast</h2>
<ul>
<li><b>Light</b>: 94 to 96 °C</li>
<li><b>Medium</b>: 92 to 94 °C</li>
<li><b>Dark</b>: 88 to 91 °C</li>
</ul>
<p>Filter can run a degree or two hotter. Go a little cooler for decaf and for very soluble coffees such as naturals and anaerobic lots.</p>
<h2>No temperature dial?</h2>
<p>Many single-boiler machines let the temperature swing up and down. Run a little water through the group to reset it. For a hotter shot, pull right after the heater switches on. After steaming milk, flush or wait a minute, because the boiler is far too hot for coffee. Ćejf gives this advice when your machine has no temperature control.</p>
<h2>Water</h2>
<p>Coffee is mostly water. Very soft or distilled water tastes flat and can harm machines. Very hard water mutes flavour and builds up scale. Filtered tap water is a good start. Coffee water recipes, with a little magnesium and a little buffer, make flavours clearer.</p>
<h2>Scale</h2>
<p>Hard water leaves limescale in boilers and pipes. Descale every few months, more often with hard water, and consider a filter jug or softened water for the machine.</p>`,
  },
  {
    id: 'salami', group: 'deep', icon: 'flask', mins: 3, title: 'The salami shot',
    sub: 'Taste one shot in slices to see where its flavours come from.',
    lede: 'Cut one shot into slices and taste each one. It is the quickest way to learn where the flavours in a shot come from.',
    body: () => `
<h2>How</h2>
<p>Line up three or four small cups. Start the shot into the first and move to the next cup every 8 to 10 seconds, or every 10 g. Taste each cup, starting with the last one.</p>
<figure class="fig">${FIG.salami()}<figcaption>Each slice of the shot tastes different.</figcaption></figure>
<h2>What you’ll find</h2>
<ul>
<li>The <b>first</b> slice is intense, syrupy, sour and even salty.</li>
<li>The <b>middle</b> is sweet and round.</li>
<li>The <b>last</b> is thin, bitter and drying.</li>
</ul>
<h2>What it teaches</h2>
<p>The end of the shot adds bitterness and water. That is why stopping earlier fixes a harsh finish, and why a longer ratio makes a shot lighter and more extracted.</p>
<div class="tip"><b>Try this:</b> mix all the cups back together and taste your normal shot. Then mix only the first two. That is close to a ristretto.</div>`,
  },
  {
    id: 'origins', group: 'deep', icon: 'globe', mins: 5, title: 'Origins, varieties and processing',
    sub: 'Where coffee grows changes how it brews, not only how it tastes.',
    lede: 'Where coffee grows and how it is processed changes how it brews, not only how it tastes.',
    body: () => `
<h2>Altitude and density</h2>
<p>Coffee grown high up matures slowly into dense beans. Dense beans resist extraction, so they like a finer grind and hotter water. Low-grown beans and large, porous varieties extract quickly and like a coarser grind and cooler water.</p>
<figure class="fig">${FIG.density()}<figcaption>Typical positions. Any single coffee can surprise you.</figcaption></figure>
<h2>Processing</h2>
<ul>
<li><b>Washed</b> coffees are clean and bright. Crisp acidity is part of their character, so bright doesn’t always mean sour.</li>
<li><b>Natural</b> coffees dry inside the fruit. They are fruity and heavy, and extract a little faster.</li>
<li><b>Honey</b> sits between the two: sweet and round.</li>
<li><b>Anaerobic</b> and co-fermented coffees are intense and very soluble. Go a touch coarser and cooler.</li>
<li><b>Wet-hulled</b> coffees, mostly from Indonesia, are earthy, heavy and porous.</li>
</ul>
<h2>Varieties</h2>
<p>Gesha is floral and delicate. SL28 and SL34 bring blackcurrant and brightness. Bourbon is sweet and chocolatey. Pacamara and Maragogipe are huge, porous beans that extract faster than their altitude suggests. Robusta is a different species: bitter, strong and quick to extract.</p>
<div class="tip"><b>How Ćejf uses this.</b> The roast, origin, process, variety and roast date you enter set the starting grind and temperature. The more you add, the closer the first brew lands.</div>`,
  },
  {
    id: 'engine', group: 'deep', icon: 'sparkle', mins: 4, title: 'How Ćejf decides',
    sub: 'The rules behind every suggestion.',
    lede: 'No magic. A handful of rules, applied the same way every time.',
    body: () => `
<h2>Your taste becomes a point</h2>
<p>Where you drop the marker on the compass sets two numbers: how sour or bitter, and how weak or strong. Every lever moves the cup in its own direction. A finer grind moves it toward more extraction and a little stronger. A longer ratio moves it toward more extraction and weaker. Ćejf combines two levers so the arrows point back to the centre.</p>
<h2>Grind and ratio first</h2>
<p>They are the most reliable levers, so they come first. Temperature, dose, steep time and technique follow when they fit better.</p>
<h2>Time is a gate</h2>
<p>If a shot tastes sour but ran slow, a finer grind would only choke it, so Ćejf won’t suggest one. If it tastes bitter but ran fast, coarser would make it worse, because the cause is usually channeling.</p>
<h2>The roast matters</h2>
<p>On light roasts, sour and bitter together usually means the grind is too fine, so the fix is coarser with a longer ratio. On darker roasts it usually points to uneven puck prep.</p>
<h2>It learns your grinder</h2>
<p>After two brews at different settings, Ćejf measures how many seconds one step of your grinder is worth on that coffee, and sizes the next change with it. If you already moved the grind one way and it didn’t help, it switches to other levers.</p>
<h2>Taste wins</h2>
<p>If it tastes sweet and balanced, it is dialed in, whatever the timer says.</p>`,
  },
];

/* ── backup & restore ─────────────────────────────────────────────────────── */
function exportJSON() { return JSON.stringify({ app: 'cejf', version: 3, appVersion: APP_VERSION, exported: new Date().toISOString(), state: Object.assign({}, S, { session: null }) }); }
function parseBackup(txt) {
  let o; try { o = JSON.parse(txt); } catch (e) { return null; }
  if (!o || typeof o !== 'object') return null;
  if (o.app === 'cejf' && o.state && typeof o.state === 'object') return normalize(o.state);
  if (o.v === 3 && o.settings) return normalize(o);
  const d = o.app === 'cejf' && o.data ? o.data : o;               /* Ćejf 2: { data: { c3_shots: "…" } } */
  if (Object.keys(d).some(k => k.indexOf('c3_') === 0)) {
    const m = migrateV2(k => (Object.prototype.hasOwnProperty.call(d, 'c3_' + k) ? d['c3_' + k] : null));
    if (m) { m.settings.whatsNew = false; return m; }
  }
  return null;
}
function restoreFrom(txt) {
  const st = parseBackup(txt);
  if (!st) { toast('That isn’t a Ćejf backup'); return false; }
  const keepTheme = S.settings.theme;
  S = st; S.onboarded = true; S.session = null;
  if (!S.settings.theme) S.settings.theme = keepTheme;
  save(true); render(); toast('Restored ' + S.brews.length + (S.brews.length === 1 ? ' brew' : ' brews') + ' and ' + S.coffees.length + (S.coffees.length === 1 ? ' coffee' : ' coffees'));
  return true;
}
async function copyText(txt) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(txt); return true; } } catch (e) { /* fall through */ }
  try {
    const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}
async function sendFeedback() {
  const ta = $('#fb-text'), em = $('#fb-email'), st = $('#fb-status'), btn = $('[data-act="feedback-send"]');
  const text = (ta.value || '').trim(), email = (em.value || '').trim();
  const say = (t, cls) => { st.textContent = t; st.className = 'grow fb-status ' + (cls || ''); };
  if (text.length < 5) { say('Write a little more first.', 'warn'); return; }
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { say('That email doesn’t look right.', 'warn'); return; }
  btn.disabled = true; btn.textContent = 'Sending…'; say('');
  try {
    const r = await fetch('https://formspree.io/f/mbdwkdnj', {
      method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify({ email: email || 'no-reply@cejf.app', message: text, app_version: APP_VERSION, level: S.settings.level,
        grinder: S.gear.grinder, machine: S.gear.hasMachine ? S.gear.machine : 'none', brews_logged: S.brews.length }),

    if (r.ok) { say('Sent. Thank you!', 'ok'); ta.value = ''; em.value = ''; }
    else {
      let msg = 'Couldn’t send. Please try again later.';
      try { const d = await r.json(); if (d && Array.isArray(d.errors) && d.errors.length) msg = d.errors.map(e => e.message).join(', '); } catch (e) { /* keep default */ }
      say(msg, 'warn');
    }
  } catch (e) { say('No connection. Please try again later.', 'warn'); }
  btn.disabled = false; btn.textContent = 'Send';
}

Object.assign(ACT, {
  'set-level': el => { S.settings.level = el.dataset.v === 'detailed' ? 'detailed' : 'simple'; save(); render(); },
  level: el => { S.settings.level = el.dataset.v === 'detailed' ? 'detailed' : 'simple'; save(); render(); toast(detailed() ? 'Detailed mode' : 'Simple mode'); },
  'set-unit': el => { S.settings.unit = el.dataset.v === 'F' ? 'F' : 'C'; save(); render(); },
  'set-theme': el => { S.settings.theme = ['auto', 'light', 'dark'].includes(el.dataset.v) ? el.dataset.v : 'auto'; save(); render(); },
  'set-basket': el => { S.gear.basketType = el.dataset.v === 'pressurized' ? 'pressurized' : 'single'; save(); render(); },
  'set-nudge': el => {
    if (el.dataset.k !== 'basket') return;
    S.gear.basket = clamp(S.gear.basket + Number(el.dataset.d), 6, 30);
    for (const k of Object.keys(S.work)) if (k.includes('|espresso|') && S.work[k].auto && S.work[k].shot === 1) delete S.work[k];
    save(); render();
  },
  'care-done': el => { S.care[el.dataset.v] = Date.now(); save(); render(); const c = CARE.find(x => x.id === el.dataset.v); toast((c ? c.name : 'Done') + ' logged'); },
  export: () => {
    try {
      const blob = new Blob([exportJSON()], { type: 'application/json' }), url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'cejf-backup-' + todayISO() + '.json';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
      toast(window.CEJF_FULL ? 'Backup saved' : 'Backup ready. If nothing downloaded, use Copy');
    } catch (e) { toast('Couldn’t save a file here. Use Copy instead'); }
  },
  'export-copy': async () => {
    const txt = exportJSON(), ok = await copyText(txt);
    if (ok) { toast('Backup copied. Paste it somewhere safe'); return; }
    const a = $('#import-area'); if (!a) return;                       /* clipboard refused: show it to select by hand */
    a.innerHTML = '<div class="import-box"><textarea id="export-text" readonly aria-label="Backup text"></textarea><p class="sub">Copying isn’t allowed here. Select all of this text and copy it yourself.</p></div>';
    const ta = $('#export-text'); ta.value = txt; ta.focus(); ta.select();
  },
  'import-paste': () => {
    const a = $('#import-area'); if (!a) return;
    a.innerHTML = '<div class="import-box"><textarea id="import-text" placeholder="Paste a Ćejf backup here" aria-label="Backup text"></textarea><div class="row"><button class="btn quiet sm" data-act="import-cancel">Cancel</button><button class="btn sm" data-act="import-go">Restore</button></div><p class="sub">Restoring replaces what’s on this device.</p></div>';
    $('#import-text').focus();
  },
  'import-cancel': () => { const a = $('#import-area'); if (a) a.innerHTML = ''; },
  'import-go': () => { const t = $('#import-text'); if (t && t.value.trim()) restoreFrom(t.value.trim()); },
  wipe: () => {
    $('#wipe-confirm').innerHTML = '<div class="confirm"><p>Delete all ' + S.brews.length + ' brews, ' + S.coffees.length + ' coffees and your settings from this device? This can’t be undone.</p><div class="row"><button class="btn quiet sm" data-act="wipe-no">Keep everything</button><button class="btn sm danger-fill" data-act="wipe-yes">Delete everything</button></div></div>';
  },
  'wipe-no': () => { const e = $('#wipe-confirm'); if (e) e.innerHTML = ''; },
  'wipe-yes': () => {
    const ls = storage();
    if (ls) { try { const keys = []; for (let i = 0; i < ls.length; i++) { const k = ls.key(i); if (k === KEY || (k && k.indexOf('c3_') === 0)) keys.push(k); } keys.forEach(k => ls.removeItem(k)); } catch (e) { /* ignore */ } }
    S = defaults(); R.tab = 'brew'; R.coffee = null; R.article = null;
    save(true); render(); showOnboarding();
  },
  'feedback-send': () => sendFeedback(),
});
Object.assign(CHG, {
  machine: el => { const note = setMachine(el.value); save(); render(); if (note) toast(note); },
  grinder: el => { const before = S.gear.grinder; setGrinder(el.value); save(); render(); if (before !== S.gear.grinder) toast('Starting recipes updated for your grinder'); },
  'set-milk': el => { if (MILKS[el.value]) S.settings.milk = el.value; save(); },
  zone: el => {
    const k = el.dataset.z, i = Number(el.dataset.i), v = parseFloat(el.value);
    const g = grinderObj(), z = Object.assign({}, g.zones, S.gear.zoneOverrides);
    const r = (z[k] || [0, 0]).slice();
    if (!Number.isFinite(v) || v < 0) { setTimeout(render, 0); return; }
    r[i] = v;
    if (r[1] <= r[0]) { toast('The coarse end needs a higher number than the fine end'); setTimeout(render, 0); return; }
    S.gear.zoneOverrides = Object.assign({}, S.gear.zoneOverrides, { [k]: r });
    syncCustomGrinder();
    S.work = {}; S.session = null; save(); setTimeout(render, 0);
  },
  'import-file': el => {
    const f = el.files && el.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { restoreFrom(String(rd.result || '')); el.value = ''; };
    rd.onerror = () => toast('Couldn’t read that file');
    rd.readAsText(f);
  },
});

/* app/80-onboard.js */
/* ── Ćejf app · first run ─────────────────────────────────────────────────── */
let OB = null;
function showOnboarding() {
  OB = { step: 0, level: S.settings.level || 'simple', machine: S.gear.hasMachine ? S.gear.machine : 'none', grinder: S.gear.grinder };
  let el = $('#onb');
  if (!el) {
    el = document.createElement('div'); el.id = 'onb'; el.className = 'onb';
    el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'Welcome to Ćejf');
    document.body.appendChild(el);
  }
  document.body.classList.add('onb-open');
  drawOnb();
}
/* The welcome animation: a sour, weak cup finds its way to the sweet spot. */
function heroCompass() {
  const R = 92, P = [[-0.55, -0.62], [0.214, -0.429], [0, 0]].map(([x, y]) => [x * R, -y * R]);
  const still = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const d = 'M' + P.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L');
  const grad = (id, cx, cy, v) => '<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="0.78"><stop offset="0" style="stop-color:var(' + v + ')"/><stop offset="1" style="stop-color:var(' + v + ');stop-opacity:0"/></radialGradient>';
  const tag = (t, x, y, delay) => { const w = t.length * 5.4 + 12; return '<g class="h-tag" style="animation-delay:' + delay + 's" transform="translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ')"><rect x="' + (-w / 2).toFixed(1) + '" y="-7.5" width="' + w.toFixed(1) + '" height="15" rx="7.5"/><text text-anchor="middle" y="3.3">' + t + '</text></g>'; };
  const lab = (t, x, y, a, c) => '<text class="h-lab" x="' + x + '" y="' + y + '" text-anchor="' + a + '" style="fill:var(' + c + ')">' + t + '</text>';
  return '<svg viewBox="-104 -104 208 208" role="img" aria-label="A sour, weak coffee on the taste compass, with arrows leading to the sweet spot in the middle">' +
    '<defs>' + grad('hg-s', '0', '0.5', '--tint-sour') + grad('hg-b', '1', '0.5', '--tint-bitter') + grad('hg-w', '0.5', '1', '--tint-weak') + grad('hg-t', '0.5', '0', '--tint-strong') +
    '</defs>' +
    '<circle class="h-disc" r="' + R + '"/>' + ['hg-s', 'hg-b', 'hg-w', 'hg-t'].map(g => '<circle r="' + R + '" fill="url(#' + g + ')"/>').join('') +
    '<circle class="h-ring faint" r="' + (R * 0.34).toFixed(1) + '"/><circle class="h-ring faint" r="' + (R * 0.67).toFixed(1) + '"/><circle class="h-ring" r="' + R + '"/>' +
    '<line class="h-axis" x1="-' + R + '" x2="' + R + '" y1="0" y2="0"/><line class="h-axis" y1="-' + R + '" y2="' + R + '" x1="0" x2="0"/>' +
    lab('SOUR', -84, 3, 'start', '--sour') + lab('BITTER', 84, 3, 'end', '--bitter') + lab('STRONG', 0, -76, 'middle', '--strong') + lab('WEAK', 0, 82, 'middle', '--weak') +
    '<circle class="h-sweet" r="' + (R * 0.15).toFixed(1) + '"/>' +
    '<circle class="h-ghost" cx="' + P[0][0].toFixed(1) + '" cy="' + P[0][1].toFixed(1) + '" r="4"/>' +
    '<circle class="h-ripple" r="' + (R * 0.15).toFixed(1) + '"/><circle class="h-ripple r2" r="' + (R * 0.15).toFixed(1) + '"/>' +
    '<path class="h-path" pathLength="1" d="' + d + '"/>' +
    tag('FINER', (P[0][0] + P[1][0]) / 2 - 6, (P[0][1] + P[1][1]) / 2 - 15, 1.6) + tag('SHORTER', (P[1][0] + P[2][0]) / 2 + 30, (P[1][1] + P[2][1]) / 2 + 2, 2.1) +
    (still ? '<circle class="h-dot" r="8.5"/>'
      : '<circle class="h-dot" r="8.5"><animateMotion dur="2.4s" begin="0s" fill="freeze" calcMode="spline" keyPoints="0;0;1" keyTimes="0;0.375;1" keySplines="0 0 1 1;.6 .1 .2 1" path="' + d + '"/></circle>') +
    '</svg>';
}
function onbChoice(act, v, cur, t, d) {
  return '<button data-act="' + act + '" data-v="' + v + '" aria-pressed="' + (cur === v) + '"><div class="c1">' + t + '</div><div class="c2">' + d + '</div></button>';
}
function drawOnb() {
  const el = $('#onb'); if (!el || !OB) return;
  const s = OB.step;
  let h = '<div class="onb-in">';
  if (s > 0) h += '<div class="onb-top"><button class="icon-btn" data-act="onb-back" aria-label="Back">' + I.back + '</button><div class="onb-steps" aria-hidden="true">' + [1, 2, 3].map(i => '<i class="' + (i === s ? 'on' : '') + '"></i>').join('') + '</div><span style="width:40px"></span></div>';
  if (s === 0) {
    h += '<div class="onb-hero center">' + wordmark('', 'Ćejf') + '<div class="pron">/chayf/ · coffee, just the way you like it</div>' +
      '<div class="hero-compass">' + heroCompass() + '</div>' +
      '<h1>Tell it how your coffee tastes. It tells you what to change.</h1>' +
      '<p class="lead">Espresso, pour over, AeroPress, moka or Turkish coffee. For your first cup or your five-hundredth.</p></div>' +
      '<div class="onb-foot"><button class="btn block" data-act="onb-next">Get started</button><p class="fine">No account. Everything stays on this device.</p></div>';
  } else if (s === 1) {
    h += '<div class="onb-q"><h1>How much detail do you want?</h1><p class="lead">You can switch any time in Setup.</p></div>' +
      '<div class="choice">' + onbChoice('onb-level', 'simple', OB.level, 'Simple', 'One clear fix at a time, in plain words. Ideal if you’re new, or just want great coffee without the numbers.') +
      onbChoice('onb-level', 'detailed', OB.level, 'Detailed', 'Every number: shot time, flow, extraction yield and grind sensitivity, with the reasoning behind each change.') + '</div>' +
      '<div class="onb-foot"><button class="btn block" data-act="onb-next">Continue</button></div>';
  } else if (s === 2) {
    h += '<div class="onb-q"><h1>What do you brew with?</h1><p class="lead">Ćejf sets starting numbers for your gear. Not listed? Pick the closest, or “Other”.</p></div>' +
      '<div class="onb-fields"><label class="lab" for="onb-machine">Espresso machine</label><select id="onb-machine" data-chg="onb-machine">' + machineOptions(OB.machine, 'No espresso machine, just filter') + '</select>' +
      '<label class="lab" for="onb-grinder">Grinder</label><select id="onb-grinder" data-chg="onb-grinder">' + grinderOptions(OB.grinder) + '</select>' +
      '<p class="sub">' + (OB.grinder === 'other_grinder' ? 'You can enter your grinder’s ranges later in Setup.' : OB.grinder === 'nogrinder' ? 'No problem. Ćejf will tell you which grind to buy and use other levers.' : 'Ćejf learns how your grinder behaves from your brews.') + '</p></div>' +
      '<div class="onb-foot"><button class="btn block" data-act="onb-next">Continue</button></div>';
  } else {
    h += '<div class="onb-q"><h1>Here’s how it works.</h1></div>' +
      '<ol class="onb-how"><li><b>Brew</b> with the recipe Ćejf suggests. Add your coffee for a better start.</li>' +
      '<li><b>Taste</b> and drop a marker on the compass: sour or bitter, weak or strong.</li>' +
      '<li><b>Follow the arrows.</b> One or two changes per ' + (OB.machine === 'none' ? 'brew' : 'shot') + ', until it’s sweet.</li></ol>' +
      '<div class="onb-foot"><button class="btn block" data-act="onb-done">Start brewing</button></div>';
  }
  el.innerHTML = h + '</div>';
  el.scrollTop = 0;
  const f = $('.btn', el); if (f && s > 0) setTimeout(() => { try { f.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }, 50);
}
function finishOnboarding() {
  if (!OB) return;
  S.settings.level = OB.level === 'detailed' ? 'detailed' : 'simple';
  setMachine(OB.machine);
  setGrinder(OB.grinder);
  S.cur.mode = S.gear.hasMachine ? 'espresso' : 'filter';
  S.onboarded = true; OB = null;
  save(true);
  const el = $('#onb'); if (el) { el.classList.add('out'); setTimeout(() => el.remove(), 320); }
  document.body.classList.remove('onb-open');
  R.tab = 'brew'; render();
}
Object.assign(ACT, {
  'onb-next': () => { if (!OB) return; OB.step = Math.min(3, OB.step + 1); drawOnb(); },
  'onb-back': () => { if (!OB) return; OB.step = Math.max(0, OB.step - 1); drawOnb(); },
  'onb-level': el => { if (!OB) return; OB.level = el.dataset.v; drawOnb(); },
  'onb-done': () => finishOnboarding(),
});
Object.assign(CHG, {
  'onb-machine': el => {
    if (!OB) return;
    OB.machine = el.value;
    const M = MACHINES[el.value];
    if (M && M.grinder && (OB.grinder === 'other_grinder' || OB.grinder === 'nogrinder')) OB.grinder = M.grinder;
    drawOnb();
  },
  'onb-grinder': el => { if (!OB) return; OB.grinder = Engine.grinderId(el.value); drawOnb(); },
});

/* app/90-boot.js */
/* ── Ćejf app · boot and event wiring ────────────────────────────────────── */
function runAct(el, e) {
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  try { fn(el, e); } catch (err) { console.error(err); toast('Something went wrong. Please try again.'); }
}

Object.assign(ACT, {
  go: el => go(el.dataset.tab),
  mode: el => {
    const v = el.dataset.mode === 'filter' ? 'filter' : 'espresso';
    if (v === S.cur.mode) {
      if (v !== 'filter') return;
      const M = METHODS[S.cur.filterMethod];
      if (M && M.family === 'stovetop') {                       /* from Turkish or moka back to the last filter brewer */
        S.cur.filterMethod = S.cur.lastBrewer && METHODS[S.cur.lastBrewer] ? S.cur.lastBrewer : 'v60';
        save(); render(); toast(METHODS[S.cur.filterMethod].name);
      } else openMethodSheet();
      return;
    }
    if (sess().running) { toast('Stop the timer first'); return; }
    S.cur.mode = v; save(); render(); window.scrollTo(0, 0);
  },
  'sheet-close': () => closeSheet(),
  timer: () => timerTap(),
  'timer-reset': () => timerReset(),
  drink: el => {
    const v = el.dataset.v === 'milk' ? 'milk' : 'straight';
    if (S.settings.drink === v) return;
    S.settings.drink = v;
    const k = workKey(methodId(), recipeIdFor(methodId())), w = S.work[k];
    if (w && w.auto && w.shot === 1) delete S.work[k];            /* untouched starting recipe: re-plan it for milk */
    save(); render();
  },
  check: el => {
    const se = sess(), i = Number(el.dataset.i);
    se.checks = (se.checks || []).slice();
    const j = se.checks.indexOf(i);
    if (j >= 0) se.checks.splice(j, 1); else se.checks.push(i);
    save(); render();
  },
  'whatsnew-ok': () => { S.settings.whatsNew = false; save(); render(); },
});

function boot() {
  S = loadState();
  syncCustomGrinder();
  applyTheme();
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true') return;
    runAct(el, e);
  });
  document.addEventListener('change', e => {
    const el = e.target.closest('[data-chg]');
    if (el && CHG[el.dataset.chg]) { try { CHG[el.dataset.chg](el, e); } catch (err) { console.error(err); toast('Something went wrong. Please try again.'); } }
  });
  document.addEventListener('input', e => {
    const el = e.target.closest('[data-inp]');
    if (el && INP[el.dataset.inp]) { try { INP[el.dataset.inp](el, e); } catch (err) { console.error(err); } }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && inSheet()) closeSheet(); });
  document.addEventListener('pointerup', () => { if (holdStop) holdStop(); });
  window.addEventListener('scroll', () => { const h = $('#hdr'); if (h) h.classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', applyTheme); else if (mq.addListener) mq.addListener(applyTheme);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { if (S.session && S.session.running) { loop(); lockWake(true); } }
    else save(true);
  });
  window.addEventListener('pagehide', () => save(true));
  render();
  if (!S.onboarded) showOnboarding();
  if (/[?&]cejf-test\b/.test(location.search)) {
    window.CEJF_TEST = {
      get S() { return S; }, set S(v) { S = v; }, R, render, save, sess, getWork, Engine, Compass, openTaste, runAct, parseGrind, exportJSON, parseBackup,
      restoreFrom, migrateV2, normalize, loadState, stepsFor, turkishSteps, runDiagnosis, applyFix, methodId, recipeIdFor, workKey, historyFor, localizeTemps, tasteNow,
      act(name, data) { const b = document.createElement('button'); b.dataset.act = name; Object.assign(b.dataset, data || {}); document.body.appendChild(b); b.click(); b.remove(); },
    };
  }
  if (window.CEJF_FULL && 'serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* offline support is optional */ }); });
  }
}
boot();

})();
